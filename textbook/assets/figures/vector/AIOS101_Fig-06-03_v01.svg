<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 6-3 查询与文档片段的语义近邻</title><desc>二维教学散点中，查询这个项目主要学什么与两条课程定位片段相近，与年度发布日期说明较远。坐标没有人工语义名称，位置与距离不是实际嵌入结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1220" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从模型到智能体</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 6-3  查询与文档片段的语义近邻</text><text x="60" y="170" font-size="26" fill="#D15F43" font-weight="600">二维近邻示意 · 非实际嵌入模型坐标输出</text><rect x="60" y="220" width="1480" height="720" rx="16" fill="white" stroke="#D7D3C9" stroke-width="2"/><path d="M140 860H1450 M140 860V280" stroke="#B9B7B0" stroke-width="3" fill="none" /><ellipse cx="535" cy="570" rx="270" ry="220" fill="#EEEAFB" stroke="#5146D9" stroke-dasharray="8 6"/><path d="M520 570L430 430" stroke="#327F78" stroke-width="3" fill="none" /><path d="M520 570L665 685" stroke="#327F78" stroke-width="3" fill="none" /><path d="M520 570L1260 360" stroke="#888D96" stroke-width="3" fill="none" stroke-dasharray="8 6"/><circle cx="520" cy="570" r="16" fill="#5146D9"/><text x="555" y="565" font-size="25" fill="#5146D9" font-weight="600">查询</text><text x="555" y="608" font-size="25" fill="#1D2433" font-weight="400">这个项目主要学什么</text><circle cx="430" cy="430" r="12" fill="#327F78"/><text x="220" y="345" font-size="24" fill="#327F78" font-weight="400">相近：课程聚焦 AI 基础设施</text><text x="220" y="385" font-size="24" fill="#327F78" font-weight="400">与大模型系统</text><circle cx="665" cy="685" r="12" fill="#327F78"/><text x="310" y="780" font-size="24" fill="#327F78" font-weight="400">相近：项目提供 AI 系统课程资源</text><circle cx="1260" cy="360" r="12" fill="#D15F43"/><text x="965" y="280" font-size="24" fill="#D15F43" font-weight="400">较远：某年度的发布日期说明</text><text x="80" y="1035" font-size="28" fill="#5146D9" font-weight="600">只表达简化的相近／较远关系，不赋予坐标轴人工语义。</text><path d="M60 1090H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1129" font-size="20" fill="#565E69" font-weight="400">位置、距离与包围区域均为教学设计；不表示真实向量值、检索得分或模型测量结果。</text><text x="60" y="1159" font-size="20" fill="#565E69" font-weight="400">含义接近不保证材料真实，也不保证它足以支持当前任务。</text></svg>