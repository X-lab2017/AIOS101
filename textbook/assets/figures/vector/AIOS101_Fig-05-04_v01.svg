<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 5-4 从候选分布到输出结束的主要生成条件</title><desc>候选概率、温度、top-k、top-p、随机种子与实现环境共同影响生成策略与 token 选择；最大生成长度与停止条件影响何时结束。任何单个参数都不能保证真实性。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1220" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从训练到推理</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 5-4  从候选分布到输出结束的主要生成条件</text><text x="60" y="171" font-size="24" fill="#327F78" font-weight="600">候选选择与停止控制，分别回答选什么、何时结束。</text><rect x="60" y="225" width="520" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="272.0" font-size="26" fill="#1D2433" font-weight="600">模型给出候选 token</text><text x="84" y="306.0" font-size="26" fill="#1D2433" font-weight="400">及概率</text><path d="M580 280H640V505H730" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="375" width="520" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="422.0" font-size="26" fill="#1D2433" font-weight="600">温度：</text><text x="84" y="456.0" font-size="26" fill="#1D2433" font-weight="400">改变分布集中程度</text><path d="M580 430H640V505H730" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="525" width="520" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="572.0" font-size="26" fill="#1D2433" font-weight="600">top-p：</text><text x="84" y="606.0" font-size="26" fill="#1D2433" font-weight="400">限定累计概率候选集合</text><path d="M580 580H640V505H730" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="675" width="520" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="722.0" font-size="26" fill="#1D2433" font-weight="600">top-k：</text><text x="84" y="756.0" font-size="26" fill="#1D2433" font-weight="400">限定固定数量的候选</text><path d="M580 730H640V505H730" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="825" width="520" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="872.0" font-size="26" fill="#1D2433" font-weight="600">随机种子与实现环境：</text><text x="84" y="906.0" font-size="26" fill="#1D2433" font-weight="400">影响可重复性</text><path d="M580 880H640V505H730" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="730" y="450" width="330" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="754" y="514.0" font-size="26" fill="#1D2433" font-weight="600">生成策略与参数</text><path d="M1060 505H1190" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="1190" y="450" width="350" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="1214" y="514.0" font-size="26" fill="#1D2433" font-weight="600">选择本次 token</text><rect x="730" y="750" width="500" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="754" y="797.0" font-size="26" fill="#1D2433" font-weight="600">最大生成长度</text><text x="754" y="831.0" font-size="26" fill="#1D2433" font-weight="400">与停止条件</text><rect x="1190" y="950" width="350" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="1214" y="1014.0" font-size="26" fill="#1D2433" font-weight="600">决定何时停止</text><path d="M1365 560V950" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M980 860V1005H1190" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M60 1090H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1129" font-size="20" fill="#565E69" font-weight="400">温度不是创造力或真实性开关；没有一个生成参数可以直接保证整体质量。</text><text x="60" y="1159" font-size="20" fill="#565E69" font-weight="400">同时记录实际启用的温度、top-k、top-p、随机设置、实现环境与停止条件。</text></svg>