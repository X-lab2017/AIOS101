<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1470" viewBox="0 0 1600 1470" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 4-2 FineWeb 论文报告的主要数据处理链</title><desc>96 个 Common Crawl 快照依次经过 WARC 文本提取、基础过滤、逐快照去重、部分 C4 过滤、自定义过滤与部分个人信息匿名化，形成约 15 万亿 token 的 FineWeb。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1470" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从数据到模型</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 4-2  FineWeb 论文报告的主要数据处理链</text><text x="60" y="165" font-size="25" fill="#327F78" font-weight="400">从网页存档到训练材料，每一步都包含数据决策。</text><path d="M110 308V343" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="205" width="100" height="103" rx="14" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="85" y="270" font-size="35" fill="#5146D9" font-weight="600">01</text><rect x="200" y="205" width="1340" height="103" rx="16" fill="#FFFFFF" stroke="#D7D3C9" stroke-width="2"/><text x="228" y="245" font-size="27" fill="#1D2433" font-weight="600">96 个 Common Crawl 快照</text><text x="228" y="282" font-size="22" fill="#565E69" font-weight="400">公开网页快照；不是直接可用的训练文本</text><path d="M1360 228H1495" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 245H1480" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 262H1465" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 279H1495" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M110 446V481" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="343" width="100" height="103" rx="14" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="85" y="408" font-size="35" fill="#5146D9" font-weight="600">02</text><rect x="200" y="343" width="1340" height="103" rx="16" fill="#FFFFFF" stroke="#D7D3C9" stroke-width="2"/><text x="228" y="383" font-size="27" fill="#1D2433" font-weight="600">从 WARC 提取文本</text><text x="228" y="420" font-size="22" fill="#565E69" font-weight="400">从网页存档中分离正文</text><path d="M1360 366H1480" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 383H1465" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 400H1495" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 417H1480" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M110 584V619" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="481" width="100" height="103" rx="14" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="85" y="546" font-size="35" fill="#5146D9" font-weight="600">03</text><rect x="200" y="481" width="1340" height="103" rx="16" fill="#FFFFFF" stroke="#D7D3C9" stroke-width="2"/><text x="228" y="521" font-size="27" fill="#1D2433" font-weight="600">基础过滤</text><text x="228" y="558" font-size="22" fill="#565E69" font-weight="400">URL、语言、质量与重复内容等筛选</text><path d="M1360 504H1465" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 521H1495" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 538H1480" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 555H1465" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M110 722V757" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="619" width="100" height="103" rx="14" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="85" y="684" font-size="35" fill="#5146D9" font-weight="600">04</text><rect x="200" y="619" width="1340" height="103" rx="16" fill="#FFFFFF" stroke="#D7D3C9" stroke-width="2"/><text x="228" y="659" font-size="27" fill="#1D2433" font-weight="600">逐快照去重</text><text x="228" y="696" font-size="22" fill="#565E69" font-weight="400">在每个快照内部处理相似文档</text><path d="M1360 642H1495" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 659H1480" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 676H1465" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 693H1495" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M110 860V895" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="757" width="100" height="103" rx="14" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="85" y="822" font-size="35" fill="#5146D9" font-weight="600">05</text><rect x="200" y="757" width="1340" height="103" rx="16" fill="#FFFFFF" stroke="#D7D3C9" stroke-width="2"/><text x="228" y="797" font-size="27" fill="#1D2433" font-weight="600">选择性采用部分 C4 过滤</text><text x="228" y="834" font-size="22" fill="#565E69" font-weight="400">比较后采用部分规则，非全部照搬</text><path d="M1360 780H1480" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 797H1465" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 814H1495" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 831H1480" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M110 998V1033" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="895" width="100" height="103" rx="14" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="85" y="960" font-size="35" fill="#5146D9" font-weight="600">06</text><rect x="200" y="895" width="1340" height="103" rx="16" fill="#FFFFFF" stroke="#D7D3C9" stroke-width="2"/><text x="228" y="935" font-size="27" fill="#1D2433" font-weight="600">加入自定义过滤</text><text x="228" y="972" font-size="22" fill="#565E69" font-weight="400">根据统计特征与实验结果增加处理条件</text><path d="M1360 918H1465" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 935H1495" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 952H1480" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 969H1465" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M110 1136V1171" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="1033" width="100" height="103" rx="14" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="85" y="1098" font-size="35" fill="#5146D9" font-weight="600">07</text><rect x="200" y="1033" width="1340" height="103" rx="16" fill="#FFFFFF" stroke="#D7D3C9" stroke-width="2"/><text x="228" y="1073" font-size="27" fill="#1D2433" font-weight="600">公开发布时进行部分个人信息匿名化</text><text x="228" y="1110" font-size="22" fill="#565E69" font-weight="400">包括电子邮件地址和公开 IP 地址</text><path d="M1360 1056H1495" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 1073H1480" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 1090H1465" stroke="#A49CC9" stroke-width="3" fill="none" /><path d="M1360 1107H1495" stroke="#A49CC9" stroke-width="3" fill="none" /><rect x="60" y="1171" width="100" height="103" rx="14" fill="#E1EFEB" stroke="#5146D9" stroke-width="2"/><text x="85" y="1236" font-size="35" fill="#5146D9" font-weight="600">08</text><rect x="200" y="1171" width="1340" height="103" rx="16" fill="#E1EFEB" stroke="#D7D3C9" stroke-width="2"/><text x="228" y="1211" font-size="27" fill="#1D2433" font-weight="600">约 15 万亿 token 的 FineWeb</text><text x="228" y="1248" font-size="22" fill="#565E69" font-weight="400">按论文所用 GPT-2 分词方式统计</text><path d="M1360 1194H1480" stroke="#327F78" stroke-width="3" fill="none" /><path d="M1360 1211H1465" stroke="#327F78" stroke-width="3" fill="none" /><path d="M1360 1228H1495" stroke="#327F78" stroke-width="3" fill="none" /><path d="M1360 1245H1480" stroke="#327F78" stroke-width="3" fill="none" /><path d="M60 1340H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1379" font-size="20" fill="#565E69" font-weight="400">来源：Penedo 等，The FineWeb Datasets，arXiv:2406.17557v2（2024-10-31）。</text><text x="60" y="1409" font-size="20" fill="#565E69" font-weight="400">本图描述 FineWeb 的形成，不表示 DeepSeek 或其他模型使用了这套数据。</text></svg>