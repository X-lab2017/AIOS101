<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1947" viewBox="0 0 1600 1947" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 6-6 一次工具调用的消息与执行角色</title><desc>来源：李博杰《深入理解 AI Agent》第二章，固定提交 dbc046eb896ac4e39aa19c7774c8bf49583b89a6。；Apache License 2.0；从原文选取字段并换行排版，非原网页截图；省略字段不构成完整可执行请求。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1947" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从模型到智能体</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 6-6  一次工具调用的消息与执行角色</text><text x="60" y="174" font-size="24" fill="#D15F43" font-weight="600">固定原文代码字段节选 · 仅展示天气分支 · 省略时间分支与重复历史</text><rect x="60" y="220" width="1480" height="426" rx="16" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="90" y="269" font-size="29" fill="#327F78" font-weight="600">01  第一次请求：开发者提供工具定义</text><text x="95" y="324" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">&quot;name&quot;: &quot;get_weather&quot;,</text><text x="95" y="361" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">&quot;parameters&quot;: {</text><text x="95" y="398" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">  &quot;type&quot;: &quot;object&quot;,</text><text x="95" y="435" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">  &quot;properties&quot;: {</text><text x="95" y="472" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">    &quot;city&quot;: {&quot;type&quot;:&quot;string&quot;,&quot;description&quot;:&quot;City name&quot;},</text><text x="95" y="509" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">    &quot;unit&quot;: {&quot;type&quot;:&quot;string&quot;,&quot;enum&quot;:[&quot;celsius&quot;,&quot;fahrenheit&quot;]}</text><text x="95" y="546" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">  }</text><text x="95" y="583" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">}</text><text x="85" y="692" font-size="25" fill="#5146D9" font-weight="600">工具说明由开发者提供；模型据此决定是否提出调用请求。</text><rect x="60" y="756" width="1480" height="426" rx="16" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="90" y="805" font-size="29" fill="#327F78" font-weight="600">02  模型响应：assistant 提出调用请求</text><text x="95" y="860" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">&quot;role&quot;: &quot;assistant&quot;,</text><text x="95" y="897" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">&quot;tool_calls&quot;: [{</text><text x="95" y="934" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">  &quot;id&quot;: &quot;call_def456&quot;,</text><text x="95" y="971" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">  &quot;function&quot;: {</text><text x="95" y="1008" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">    &quot;name&quot;: &quot;get_weather&quot;,</text><text x="95" y="1045" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">    &quot;arguments&quot;: &quot;{\&quot;city\&quot;: \&quot;Vancouver\&quot;, \&quot;unit\&quot;: \&quot;celsius\&quot;}&quot;</text><text x="95" y="1082" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">  }</text><text x="95" y="1119" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">}]</text><text x="85" y="1228" font-size="25" fill="#5146D9" font-weight="600">call_def456 标识这次调用；请求本身不证明工具已执行。</text><rect x="60" y="1292" width="1480" height="315" rx="16" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="90" y="1341" font-size="29" fill="#327F78" font-weight="600">03  第二次请求：框架加入 tool 结果</text><text x="95" y="1396" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">&quot;role&quot;: &quot;tool&quot;,</text><text x="95" y="1433" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">&quot;tool_call_id&quot;: &quot;call_def456&quot;,</text><text x="95" y="1470" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">&quot;content&quot;:</text><text x="95" y="1507" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">  &quot;{\&quot;city\&quot;: \&quot;Vancouver\&quot;, \&quot;temperature\&quot;: 13.2, \&quot;unit\&quot;: \&quot;celsius\&quot;, </text><text x="95" y="1544" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#1D2433" xml:space="preserve">\&quot;conditions\&quot;: \&quot;clear\&quot;, \&quot;humidity\&quot;: 93}&quot;</text><text x="85" y="1653" font-size="25" fill="#5146D9" font-weight="600">通过相同的 tool_call_id 对应调用；框架将完整历史与结果再发给模型。</text><text x="60" y="1737" font-size="26" fill="#D15F43" font-weight="400">原教材时间、天气为预设教学内容；本图不表示实时查询或实际运行。</text><path d="M60 1817H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1856" font-size="20" fill="#565E69" font-weight="400">来源：李博杰《深入理解 AI Agent》第二章，固定提交 dbc046eb896ac4e39aa19c7774c8bf49583b89a6。</text><text x="60" y="1886" font-size="20" fill="#565E69" font-weight="400">Apache License 2.0；从原文选取字段并换行排版，非原网页截图；省略字段不构成完整可执行请求。</text></svg>