<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1360" viewBox="0 0 1600 1360" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 6-1 从模型到任务系统的基本组成</title><desc>人设定目标、约束、授权并核验，任务编排与状态连接模型、检索器和工具。外部文档进入索引，检索片段进入模型上下文；模型请求返回编排，经权限检查后工具才执行并返回结果或错误。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1360" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从模型到智能体</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 6-1  从模型到任务系统的基本组成</text><rect x="500" y="200" width="600" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="524" y="264.0" font-size="26" fill="#1D2433" font-weight="600">人：目标、约束、授权与核验</text><rect x="500" y="475" width="600" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="524" y="539.0" font-size="26" fill="#1D2433" font-weight="600">任务编排与状态</text><path d="M710 310V475" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M920 475V310" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="945" y="400" font-size="21" fill="#327F78" font-weight="400">阶段结果与待确认事项</text><rect x="60" y="735" width="440" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="799.0" font-size="26" fill="#1D2433" font-weight="600">外部文档与数据</text><rect x="60" y="985" width="440" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="1049.0" font-size="26" fill="#1D2433" font-weight="600">检索器与索引</text><rect x="650" y="985" width="470" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="674" y="1032.0" font-size="26" fill="#1D2433" font-weight="600">模型：生成回答、</text><text x="674" y="1066.0" font-size="26" fill="#1D2433" font-weight="400">计划或调用请求</text><rect x="1170" y="735" width="370" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="1194" y="799.0" font-size="26" fill="#1D2433" font-weight="600">工具与外部程序</text><path d="M280 845V985" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M500 530H30V1040H60" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M800 585V985" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M650 1040H575V610H875V585" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="595" y="680" font-size="21" fill="#327F78" font-weight="400">工具调用请求</text><path d="M500 1040H650" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="180" y="1155" font-size="21" fill="#327F78" font-weight="400">检索片段作为上下文证据</text><path d="M1100 520H1355V735" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="1130" y="640" font-size="21" fill="#327F78" font-weight="400">经权限检查后执行</text><path d="M1410 735V565H1100" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="1135" y="465" font-size="21" fill="#327F78" font-weight="400">执行结果或错误</text><path d="M60 1230H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1269" font-size="20" fill="#565E69" font-weight="400">请求、检索证据与执行结果用文字明确区分；并列组件不表示某款产品的真实架构。</text><text x="60" y="1299" font-size="20" fill="#565E69" font-weight="400">人设定目标与权限并核验结果；模型、资料库与实际执行程序承担不同角色。</text></svg>