<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2260" viewBox="0 0 1600 2260" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 6-10 人机协作中的关键检查点</title><desc>准备动作、人工决定、技术检查和实际执行按先后区分；拒绝后不执行该动作。；人工确认不是唯一防线；每轮继续均受权限、预算、日志和停止条件约束。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="2260" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从模型到智能体</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 6-10  人机协作中的关键检查点</text><rect x="60" y="205" width="760" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="84" y="269.0" font-size="26" fill="#1D2433" font-weight="600">提出任务：目标、资料范围与权限</text><path d="M440 315V395" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="395" width="760" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="84" y="459.0" font-size="26" fill="#1D2433" font-weight="600">资料与权限是否必要且合适？</text><rect x="1040" y="395" width="500" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="1064" y="442.0" font-size="26" fill="#1D2433" font-weight="600">停止或缩小范围</text><text x="1064" y="476.0" font-size="26" fill="#1D2433" font-weight="400">不执行该动作</text><path d="M820 450H1040" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="900" y="425" font-size="22" fill="#327F78" font-weight="400">否</text><path d="M440 505V585" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="470" y="555" font-size="22" fill="#327F78" font-weight="400">是</text><rect x="60" y="585" width="760" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="632.0" font-size="26" fill="#1D2433" font-weight="600">准备上下文与拟执行动作</text><text x="84" y="666.0" font-size="26" fill="#1D2433" font-weight="400">尚未执行工具</text><path d="M440 695V775" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="775" width="760" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="84" y="822.0" font-size="26" fill="#1D2433" font-weight="600">敏感数据、对外影响</text><text x="84" y="856.0" font-size="26" fill="#1D2433" font-weight="400">或不可逆动作？</text><rect x="1040" y="775" width="500" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="1064" y="822.0" font-size="26" fill="#1D2433" font-weight="600">展示动作、输入与后果</text><text x="1064" y="856.0" font-size="26" fill="#1D2433" font-weight="400">请求人工决定</text><path d="M820 830H1040" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="905" y="805" font-size="22" fill="#327F78" font-weight="400">是</text><path d="M1290 885V975" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="1040" y="975" width="500" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="1064" y="1039.0" font-size="26" fill="#1D2433" font-weight="600">是否获准？</text><path d="M1540 1030H1570V450H1540" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="1165" y="665" font-size="22" fill="#327F78" font-weight="400">否：拒绝则不执行</text><path d="M1290 1085V1160H820" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="1315" y="1145" font-size="22" fill="#327F78" font-weight="400">是</text><path d="M440 885V1135" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="470" y="1015" font-size="22" fill="#327F78" font-weight="400">否</text><rect x="60" y="1135" width="760" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="84" y="1182.0" font-size="26" fill="#1D2433" font-weight="600">执行前技术检查</text><text x="84" y="1216.0" font-size="26" fill="#1D2433" font-weight="400">输入、参数、权限与预算</text><path d="M820 1220H980V1325H1040" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="840" y="1298" font-size="22" fill="#327F78" font-weight="400">未通过</text><rect x="1040" y="1270" width="500" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="1064" y="1317.0" font-size="26" fill="#1D2433" font-weight="600">停止并说明原因</text><text x="1064" y="1351.0" font-size="26" fill="#1D2433" font-weight="400">不执行该动作</text><path d="M440 1245V1365" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="470" y="1318" font-size="22" fill="#327F78" font-weight="400">通过</text><rect x="60" y="1365" width="760" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="1429.0" font-size="26" fill="#1D2433" font-weight="600">执行获准的步骤</text><path d="M440 1475V1555" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="1555" width="760" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="1619.0" font-size="26" fill="#1D2433" font-weight="600">核验结果、证据与停止条件</text><path d="M440 1665V1745" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="1745" width="760" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="84" y="1809.0" font-size="26" fill="#1D2433" font-weight="600">任务完成且证据充分？</text><path d="M820 1800H1040" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="905" y="1775" font-size="22" fill="#327F78" font-weight="400">否</text><rect x="1040" y="1745" width="500" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="1064" y="1792.0" font-size="26" fill="#1D2433" font-weight="600">在约束内决定继续或停止</text><text x="1064" y="1826.0" font-size="26" fill="#1D2433" font-weight="400">保留未完成事项</text><path d="M440 1855V1955" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="470" y="1915" font-size="22" fill="#327F78" font-weight="400">是</text><rect x="60" y="1955" width="760" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="84" y="2019.0" font-size="26" fill="#1D2433" font-weight="600">交付结果、来源、日志与责任说明</text><text x="1060" y="1975" font-size="25" fill="#5146D9" font-weight="600">继续须重新经过检查。</text><text x="1060" y="2025" font-size="24" fill="#1D2433" font-weight="400">批准不能绕过技术约束。</text><path d="M60 2130H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="2169" font-size="20" fill="#565E69" font-weight="400">准备动作、人工决定、技术检查和实际执行按先后区分；拒绝后不执行该动作。</text><text x="60" y="2199" font-size="20" fill="#565E69" font-weight="400">人工确认不是唯一防线；每轮继续均受权限、预算、日志和停止条件约束。</text></svg>