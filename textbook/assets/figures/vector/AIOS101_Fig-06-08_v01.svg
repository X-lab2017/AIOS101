<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1700" viewBox="0 0 1600 1700" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 6-8 新生导览模拟轨迹的角色与时序</title><desc>模拟轨迹依次标注用户查询、检索器返回证据、模型草稿、核验者指出仓库体积被误写为模型大小、模型修订、模型请求保存、核验者批准指定路径模拟写入、模拟工具返回假设成功。没有真实文件写入。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1700" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从模型到智能体</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 6-8  新生导览模拟轨迹的角色与时序</text><text x="60" y="174" font-size="29" fill="#D15F43" font-weight="600">整条交互为模拟轨迹 · 未发生真实文件写入</text><text x="60" y="291" font-size="28" fill="#5146D9" font-weight="600">01</text><rect x="135" y="230" width="370" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="159" y="294.0" font-size="26" fill="#1D2433" font-weight="600">用户</text><rect x="560" y="230" width="980" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="584" y="294.0" font-size="26" fill="#1D2433" font-weight="600">查询固定 README 中的三类信息</text><path d="M505 285H560" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1070 340V370" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="60" y="431" font-size="28" fill="#5146D9" font-weight="600">02</text><rect x="135" y="370" width="370" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="159" y="434.0" font-size="26" fill="#1D2433" font-weight="600">检索器</text><rect x="560" y="370" width="980" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="584" y="434.0" font-size="26" fill="#1D2433" font-weight="600">返回相关片段与原文位置</text><path d="M505 425H560" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1070 480V510" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="60" y="571" font-size="28" fill="#5146D9" font-weight="600">03</text><rect x="135" y="510" width="370" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="159" y="574.0" font-size="26" fill="#1D2433" font-weight="600">模型</text><rect x="560" y="510" width="980" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="584" y="574.0" font-size="26" fill="#1D2433" font-weight="600">提交三项导览草稿</text><path d="M505 565H560" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1070 620V650" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="60" y="711" font-size="28" fill="#5146D9" font-weight="600">04</text><rect x="135" y="650" width="370" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="159" y="714.0" font-size="26" fill="#1D2433" font-weight="600">核验者</text><rect x="560" y="650" width="980" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="584" y="714.0" font-size="26" fill="#1D2433" font-weight="600">指出“仓库体积”被误写为“模型大小”</text><path d="M505 705H560" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1070 760V790" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="60" y="851" font-size="28" fill="#5146D9" font-weight="600">05</text><rect x="135" y="790" width="370" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="159" y="854.0" font-size="26" fill="#1D2433" font-weight="600">模型</text><rect x="560" y="790" width="980" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="584" y="854.0" font-size="26" fill="#1D2433" font-weight="600">提交修订稿</text><path d="M505 845H560" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1070 900V930" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="60" y="991" font-size="28" fill="#5146D9" font-weight="600">06</text><rect x="135" y="930" width="370" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="159" y="994.0" font-size="26" fill="#1D2433" font-weight="600">模型</text><rect x="560" y="930" width="980" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="584" y="994.0" font-size="26" fill="#1D2433" font-weight="600">请求保存指定草稿文件</text><path d="M505 985H560" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1070 1040V1070" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="60" y="1131" font-size="28" fill="#5146D9" font-weight="600">07</text><rect x="135" y="1070" width="370" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="159" y="1134.0" font-size="26" fill="#1D2433" font-weight="600">核验者</text><rect x="560" y="1070" width="980" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="584" y="1134.0" font-size="26" fill="#1D2433" font-weight="600">仅批准指定路径的模拟写入</text><path d="M505 1125H560" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1070 1180V1210" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="60" y="1271" font-size="28" fill="#5146D9" font-weight="600">08</text><rect x="135" y="1210" width="370" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="159" y="1274.0" font-size="26" fill="#1D2433" font-weight="600">文件工具（模拟）</text><rect x="560" y="1210" width="980" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="584" y="1274.0" font-size="26" fill="#1D2433" font-weight="600">返回“假设写入成功”的教学记录</text><path d="M505 1265H560" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="135" y="1410" width="1405" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="159" y="1474.0" font-size="26" fill="#1D2433" font-weight="600">请求、人工批准和模拟返回，均不能证明文件在真实环境中已经保存。</text><path d="M1070 1320V1410" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M60 1570H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1609" font-size="20" fill="#565E69" font-weight="400">按正文先后顺序标注角色；保留概念纠错、指定路径确认及“假设写入成功”。</text><text x="60" y="1639" font-size="20" fill="#565E69" font-weight="400">来源材料可以真实回查，交互过程仍是教学模拟；不把流程展示当成实测。</text></svg>