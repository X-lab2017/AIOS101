<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 6-3　语义相关，不等于证据适用</title><desc>查询何时报名截止，与旧通知9月10日和更新通知9月15日都在语义示意图中相近，与食堂菜谱较远。右侧对照两份通知，要求核对发布主体、版本、范围和替代关系；信息不足应保留冲突。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect x="0" y="0" width="1600" height="1020" rx="0" fill="#F6F3EB" stroke="#F6F3EB" stroke-width="2"/><text x="64" y="51" font-size="21" fill="#5146D9" font-weight="600" text-anchor="start">AIOS101  /  X-lab  /  自学教材</text><text x="64" y="116" font-size="39" fill="#1D2433" font-weight="700" text-anchor="start">图 6-3　语义相关，不等于证据适用</text><text x="64" y="178" font-size="28" fill="#327F78" font-weight="400" text-anchor="start">同一个问题能找回两份相近的通知，但“相近”没有替你判断哪份仍然有效。</text><text x="64" y="249" font-size="32" fill="#5146D9" font-weight="700" text-anchor="start">① 检索：哪些内容相关？</text><ellipse cx="360" cy="470" rx="250" ry="188" fill="#ECE8F8" stroke="#B3A9E3" stroke-dasharray="7 7"/><circle cx="365" cy="465" r="13" fill="#5146D9"/><text x="180" y="514" font-size="28" fill="#5146D9" font-weight="700" text-anchor="start">查询：何时报名截止？</text><path d="M365 465L206 350" stroke="#C65D43" stroke-width="2" fill="none" stroke-dasharray="9 7"/><circle cx="206" cy="350" r="10" fill="#C65D43"/><path d="M365 465L520 410" stroke="#327F78" stroke-width="2" fill="none" stroke-dasharray="9 7"/><circle cx="520" cy="410" r="10" fill="#327F78"/><text x="90" y="315" font-size="27" fill="#C65D43" font-weight="600" text-anchor="start">旧通知：9 月 10 日</text><text x="457" y="366" font-size="27" fill="#327F78" font-weight="600" text-anchor="start">更新：9 月 15 日</text><circle cx="655" cy="716" r="10" fill="#626876"/><text x="480" y="765" font-size="27" fill="#626876" font-weight="400" text-anchor="start">较远：食堂菜谱</text><text x="107" y="634" font-size="28" fill="#5146D9" font-weight="400" text-anchor="start">两份通知都谈报名截止</text><text x="850" y="249" font-size="32" fill="#327F78" font-weight="700" text-anchor="start">② 核验：哪份适用于当前任务？</text><rect x="850" y="290" width="682" height="156" rx="3" fill="white" stroke="#C8C4B9" stroke-width="2"/><rect x="850" y="290" width="10" height="156" rx="0" fill="#C65D43" stroke="#C65D43" stroke-width="2"/><text x="883" y="336" font-size="25" fill="#C65D43" font-weight="600" text-anchor="start">旧通知</text><text x="883" y="401" font-size="37" fill="#1D2433" font-weight="600" text-anchor="start">9 月 10 日报名截止</text><rect x="850" y="479" width="682" height="156" rx="3" fill="white" stroke="#C8C4B9" stroke-width="2"/><rect x="850" y="479" width="10" height="156" rx="0" fill="#327F78" stroke="#327F78" stroke-width="2"/><text x="883" y="525" font-size="25" fill="#327F78" font-weight="600" text-anchor="start">更新通知</text><text x="883" y="590" font-size="37" fill="#1D2433" font-weight="600" text-anchor="start">延期到 9 月 15 日</text><text x="850" y="695" font-size="29" fill="#327F78" font-weight="600" text-anchor="start">还要查：发布主体、版本、适用范围</text><text x="850" y="742" font-size="29" fill="#327F78" font-weight="600" text-anchor="start">更新是否明确替代旧版</text><text x="850" y="808" font-size="27" fill="#C65D43" font-weight="600" text-anchor="start">信息不足 → 保留冲突，说明无法确认</text><text x="64" y="858" font-size="29" fill="#1D2433" font-weight="600" text-anchor="start">语义检索帮助找线索；来源和版本核验帮助判断这些线索能支持什么。</text><path d="M64 891H1536" stroke="#CBC7BF" stroke-width="2" fill="none"/><text x="64" y="937" font-size="24" fill="#626876" font-weight="400" text-anchor="start">二维位置与通知日期均为教学示意，不是实际嵌入坐标或真实活动信息。</text><text x="64" y="972" font-size="24" fill="#626876" font-weight="400" text-anchor="start">距离不等于真实性；新日期也不自动证明适用，必须核对替代关系与任务范围。</text></svg>