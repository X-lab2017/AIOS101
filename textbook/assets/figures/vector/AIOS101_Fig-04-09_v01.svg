<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 4-9 训练、验证、测试及近重复泄漏的边界</title><desc>样本分为训练、验证和保留测试集。训练更新参数，验证比较与监测，候选选择完成后接触测试。虚线提示测试样本的转载、裁剪或近重复不当进入训练或选择，以及测试只支持有限结论。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1480" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从数据到模型</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 4-9  训练、验证、测试及近重复泄漏的边界</text><rect x="300" y="200" width="1000" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="324" y="264.0" font-size="26" fill="#1D2433" font-weight="600">已定义任务与来源边界的样本集合</text><rect x="60" y="470" width="460" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="534.0" font-size="26" fill="#1D2433" font-weight="600">训练集：更新参数</text><path d="M800 310V390H290V470" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="570" y="470" width="460" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="594" y="534.0" font-size="26" fill="#1D2433" font-weight="600">验证集：比较方案与监测</text><path d="M800 310V390H800V470" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="1080" y="470" width="460" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="1104" y="517.0" font-size="26" fill="#1D2433" font-weight="600">保留的测试集：</text><text x="1104" y="551.0" font-size="26" fill="#1D2433" font-weight="400">相对独立检验</text><path d="M800 310V390H1310V470" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="160" y="720" width="760" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="184" y="784.0" font-size="26" fill="#1D2433" font-weight="600">候选模型与训练选择</text><path d="M290 580V665H390V720" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M800 580V665H690V720" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M920 775H1310V580" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="1010" width="920" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="84" y="1074.0" font-size="26" fill="#1D2433" font-weight="600">测试样本的转载、裁剪或近重复版本</text><path d="M160 1010V580" stroke="#D15F43" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="175" y="933" font-size="23" fill="#D15F43" font-weight="400">不当进入训练或方案选择</text><path d="M930 1010H1000V610H820V580" stroke="#D15F43" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="1015" y="955" font-size="23" fill="#D15F43" font-weight="400">削弱测试独立性</text><rect x="1080" y="1170" width="460" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="1104" y="1234.0" font-size="26" fill="#1D2433" font-weight="600">有限结论</text><path d="M1500 580H1560V1225H1540" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="60" y="1250" font-size="24" fill="#1D2433" font-weight="400">虚线表示不当泄漏或结论边界，不是正常训练路径。</text><text x="60" y="1295" font-size="25" fill="#5146D9" font-weight="600">测试结果不能证明所有新情境都有效。</text><path d="M60 1350H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1389" font-size="20" fill="#565E69" font-weight="400">先定义来源和任务，再区分数据用途；候选选择完成后才用保留测试集检验。</text><text x="60" y="1419" font-size="20" fill="#565E69" font-weight="400">高测试成绩不自动证明泛化；转载、裁剪或近重复可能使结果过于乐观。</text></svg>