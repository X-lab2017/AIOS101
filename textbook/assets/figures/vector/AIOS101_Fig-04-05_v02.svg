<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 4-5　一次训练迭代的基本循环</title><desc>输入2、目标6的乘法模型中，参数从2示意更新为2.5，预测从4变5，平方损失从4变1。精确曲线同时标出参数3的损失0和参数4的损失4；反向传播计算梯度，优化器执行更新，再进入下一批样本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect x="0" y="0" width="1600" height="1130" rx="0" fill="#F6F3EB" stroke="#F6F3EB" stroke-width="2"/><text x="64" y="51" font-size="21" fill="#5146D9" font-weight="600" text-anchor="start">AIOS101  /  X-lab  /  自学教材</text><text x="64" y="116" font-size="39" fill="#1D2433" font-weight="700" text-anchor="start">图 4-5　一次训练迭代的基本循环</text><text x="64" y="177" font-size="28" fill="#327F78" font-weight="400" text-anchor="start">同一个样本：输入 2，目标 6；预测＝2×w；损失＝（预测−6）的平方。</text><rect x="64" y="220" width="690" height="226" rx="8" fill="white" stroke="#5146D9" stroke-width="2"/><text x="93" y="264" font-size="27" fill="#5146D9" font-weight="700" text-anchor="start">更新前</text><text x="93" y="323" font-size="43" fill="#5146D9" font-weight="700" text-anchor="start">w＝2   →   预测 4</text><text x="93" y="384" font-size="34" fill="#1D2433" font-weight="400" text-anchor="start">与目标差 -2   →   损失 4</text><rect x="846" y="220" width="690" height="226" rx="8" fill="white" stroke="#327F78" stroke-width="2"/><text x="875" y="264" font-size="27" fill="#327F78" font-weight="700" text-anchor="start">一次示意更新后</text><text x="875" y="323" font-size="43" fill="#327F78" font-weight="700" text-anchor="start">w＝2.5   →   预测 5</text><text x="875" y="384" font-size="34" fill="#1D2433" font-weight="400" text-anchor="start">与目标差 -1   →   损失 1</text><path d="M765 327H833" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="64" y="506" font-size="29" fill="#1D2433" font-weight="600" text-anchor="start">把正文的四组参数放到同一张图里</text><path d="M160 562V897H770" stroke="#626876" stroke-width="2" fill="none"/><text x="72" y="567" font-size="25" fill="#626876" font-weight="400" text-anchor="start">损失</text><text x="710" y="942" font-size="25" fill="#626876" font-weight="400" text-anchor="start">参数 w</text><path d="M160 897.0H750" stroke="#D6D3CE" stroke-width="1" fill="none"/><text x="139" y="905.0" font-size="23" fill="#626876" font-weight="400" text-anchor="end">0</text><path d="M160 843.6666666666666H750" stroke="#D6D3CE" stroke-width="1" fill="none"/><text x="139" y="851.6666666666666" font-size="23" fill="#626876" font-weight="400" text-anchor="end">1</text><path d="M160 683.6666666666667H750" stroke="#D6D3CE" stroke-width="1" fill="none"/><text x="139" y="691.6666666666667" font-size="23" fill="#626876" font-weight="400" text-anchor="end">4</text><path d="M160.00 589.80L165.90 601.97L171.80 613.88L177.70 625.56L183.60 636.99L189.50 648.17L195.40 659.10L201.30 669.79L207.20 680.24L213.10 690.44L219.00 700.39L224.90 710.10L230.80 719.56L236.70 728.78L242.60 737.75L248.50 746.47L254.40 754.95L260.30 763.18L266.20 771.17L272.10 778.91L278.00 786.41L283.90 793.66L289.80 800.66L295.70 807.42L301.60 813.93L307.50 820.20L313.40 826.22L319.30 832.00L325.20 837.53L331.10 842.81L337.00 847.85L342.90 852.64L348.80 857.19L354.70 861.49L360.60 865.54L366.50 869.35L372.40 872.92L378.30 876.23L384.20 879.31L390.10 882.13L396.00 884.71L401.90 887.05L407.80 889.14L413.70 890.98L419.60 892.58L425.50 893.93L431.40 895.03L437.30 895.89L443.20 896.51L449.10 896.88L455.00 897.00L460.90 896.88L466.80 896.51L472.70 895.89L478.60 895.03L484.50 893.93L490.40 892.58L496.30 890.98L502.20 889.14L508.10 887.05L514.00 884.71L519.90 882.13L525.80 879.31L531.70 876.23L537.60 872.92L543.50 869.35L549.40 865.54L555.30 861.49L561.20 857.19L567.10 852.64L573.00 847.85L578.90 842.81L584.80 837.53L590.70 832.00L596.60 826.22L602.50 820.20L608.40 813.93L614.30 807.42L620.20 800.66L626.10 793.66L632.00 786.41L637.90 778.91L643.80 771.17L649.70 763.18L655.60 754.95L661.50 746.47L667.40 737.75L673.30 728.78L679.20 719.56L685.10 710.10L691.00 700.39L696.90 690.44L702.80 680.24L708.70 669.79L714.60 659.10L720.50 648.17L726.40 636.99L732.30 625.56L738.20 613.88L744.10 601.97L750.00 589.80" stroke="#5146D9" stroke-width="4" fill="none"/><circle cx="209.16666666666666" cy="683.6666666666667" r="9" fill="#5146D9"/><text x="209.16666666666666" y="929" font-size="24" fill="#1D2433" font-weight="400" text-anchor="middle">2</text><text x="223.16666666666666" y="667.6666666666667" font-size="24" fill="#5146D9" font-weight="400" text-anchor="start">(2, 4)</text><circle cx="332.08333333333337" cy="843.6666666666666" r="9" fill="#327F78"/><text x="332.08333333333337" y="929" font-size="24" fill="#1D2433" font-weight="400" text-anchor="middle">2.5</text><text x="346.08333333333337" y="827.6666666666666" font-size="24" fill="#327F78" font-weight="400" text-anchor="start">(2.5, 1)</text><circle cx="455.0" cy="897.0" r="9" fill="#327F78"/><text x="455.0" y="929" font-size="24" fill="#1D2433" font-weight="400" text-anchor="middle">3</text><circle cx="700.8333333333334" cy="683.6666666666667" r="9" fill="#5146D9"/><text x="700.8333333333334" y="929" font-size="24" fill="#1D2433" font-weight="400" text-anchor="middle">4</text><text x="714.8333333333334" y="667.6666666666667" font-size="24" fill="#5146D9" font-weight="400" text-anchor="start">(4, 4)</text><text x="160" y="977" font-size="24" fill="#327F78" font-weight="400" text-anchor="start">w＝3 时，这个样本的损失为 0。</text><text x="875" y="551" font-size="31" fill="#1D2433" font-weight="700" text-anchor="start">更新依据来自哪里？</text><circle cx="893" cy="612" r="16" fill="#5146D9"/><text x="893" y="620" font-size="20" fill="white" font-weight="600" text-anchor="middle">1</text><text x="927" y="622" font-size="29" fill="#5146D9" font-weight="600" text-anchor="start">反向传播</text><text x="927" y="665" font-size="26" fill="#1D2433" font-weight="400" text-anchor="start">计算损失对参数的梯度</text><path d="M893 648v52" stroke="#5146D9" stroke-width="2" fill="none"/><circle cx="893" cy="729" r="16" fill="#5146D9"/><text x="893" y="737" font-size="20" fill="white" font-weight="600" text-anchor="middle">2</text><text x="927" y="739" font-size="29" fill="#5146D9" font-weight="600" text-anchor="start">优化器</text><text x="927" y="782" font-size="26" fill="#1D2433" font-weight="400" text-anchor="start">依据梯度及设置更新参数</text><path d="M893 765v52" stroke="#5146D9" stroke-width="2" fill="none"/><circle cx="893" cy="846" r="16" fill="#5146D9"/><text x="893" y="854" font-size="20" fill="white" font-weight="600" text-anchor="middle">3</text><text x="927" y="856" font-size="29" fill="#5146D9" font-weight="600" text-anchor="start">下一批样本</text><text x="927" y="899" font-size="26" fill="#1D2433" font-weight="400" text-anchor="start">用更新后的参数继续计算</text><text x="875" y="970" font-size="26" fill="#C65D43" font-weight="400" text-anchor="start">一步的改善，不代表所有样本都变好。</text><path d="M64 1001H1536" stroke="#CBC7BF" stroke-width="2" fill="none"/><text x="64" y="1047" font-size="24" fill="#626876" font-weight="400" text-anchor="start">数值沿用正文的乘法玩具模型；w＝2 → 2.5 是教学设定，并非执行某个优化器的实测轨迹。</text><text x="64" y="1082" font-size="24" fill="#626876" font-weight="400" text-anchor="start">曲线对应这一个样本；它说明“更大”未必“更好”，不代表真实大模型的损失地形。</text></svg>