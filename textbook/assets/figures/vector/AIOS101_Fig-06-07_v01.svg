<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1690" viewBox="0 0 1600 1690" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 6-7 智能体的基本任务循环</title><desc>目标与约束进入观察、规划、经权限检查的行动和反馈，随后检查停止条件。未停止则回到观察，停止则交付结果、证据和未完成事项。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1690" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从模型到智能体</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 6-7  智能体的基本任务循环</text><rect x="430" y="190" width="740" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="454" y="254.0" font-size="26" fill="#1D2433" font-weight="600">目标、约束与评价标准</text><path d="M800 300V390" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="430" y="390" width="740" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="454" y="437.0" font-size="26" fill="#1D2433" font-weight="600">观察：用户输入、资料、</text><text x="454" y="471.0" font-size="26" fill="#1D2433" font-weight="400">工具结果与当前状态</text><rect x="430" y="590" width="740" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="454" y="637.0" font-size="26" fill="#1D2433" font-weight="600">规划：回答、检索、</text><text x="454" y="671.0" font-size="26" fill="#1D2433" font-weight="400">调用工具或请求澄清</text><rect x="430" y="790" width="740" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="454" y="854.0" font-size="26" fill="#1D2433" font-weight="600">行动：经权限检查执行下一步</text><rect x="430" y="990" width="740" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="454" y="1037.0" font-size="26" fill="#1D2433" font-weight="600">反馈：结果、错误、</text><text x="454" y="1071.0" font-size="26" fill="#1D2433" font-weight="400">新证据或人工意见</text><path d="M800 500V590" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M800 700V790" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M800 900V990" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M800 1100V1190" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="430" y="1190" width="740" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="454" y="1254.0" font-size="26" fill="#1D2433" font-weight="600">满足停止条件？</text><path d="M430 1245H210V445H430" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="70" y="1145" font-size="21" fill="#327F78" font-weight="400">否：新观察进入下一轮</text><path d="M800 1300V1400" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="830" y="1365" font-size="21" fill="#327F78" font-weight="400">是</text><rect x="430" y="1400" width="740" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="454" y="1464.0" font-size="26" fill="#1D2433" font-weight="600">输出结果、证据与未完成事项</text><text x="1215" y="435" font-size="24" fill="#D15F43" font-weight="600">不是无限循环</text><text x="1215" y="480" font-size="21" fill="#1D2433" font-weight="400">权限、预算与失败</text><text x="1215" y="517" font-size="21" fill="#1D2433" font-weight="400">都可能构成边界。</text><path d="M60 1560H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1599" font-size="20" fill="#565E69" font-weight="400">目标、约束与停止条件从任务开始就存在；达到预算、资料不足等也可以合理停止。</text><text x="60" y="1629" font-size="20" fill="#565E69" font-weight="400">过程是系统行为示意，不表示模型具有人的意识，也不表示工具已实际运行。</text></svg>