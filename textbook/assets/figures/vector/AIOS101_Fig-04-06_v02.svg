<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1520" viewBox="0 0 1600 1520" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 4-6 批次、迭代、训练轮次与检查点</title><desc>检查点保存由训练配置决定；可按步骤、轮次等策略触发。；图示区分批次处理、轮次计数和状态保存，不规定所有框架的实现细节。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1520" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从数据到模型</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 4-6  批次、迭代、训练轮次与检查点</text><text x="60" y="175" font-size="26" fill="#327F78" font-weight="400">一个 epoch 是完整处理一轮训练集；检查点按保存策略记录状态。</text><rect x="60" y="220" width="1480" height="360" rx="16" fill="#EDF3EE" stroke="#327F78" stroke-width="2"/><text x="90" y="270" font-size="28" fill="#327F78" font-weight="600">一轮训练中的批次顺序（简化）</text><rect x="90" y="330" width="380" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="114" y="377.0" font-size="26" fill="#1D2433" font-weight="600">批次 1</text><text x="114" y="411.0" font-size="26" fill="#1D2433" font-weight="400">一次迭代</text><rect x="610" y="330" width="380" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="634" y="377.0" font-size="26" fill="#1D2433" font-weight="600">批次 2</text><text x="634" y="411.0" font-size="26" fill="#1D2433" font-weight="400">一次迭代</text><rect x="1130" y="330" width="380" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="1154" y="377.0" font-size="26" fill="#1D2433" font-weight="600">后续批次</text><text x="1154" y="411.0" font-size="26" fill="#1D2433" font-weight="400">直至本轮处理完成</text><path d="M470 385H610" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M990 385H1130" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="90" y="505" font-size="24" fill="#1D2433" font-weight="400">此处按“一批一次更新”说明。</text><text x="90" y="545" font-size="24" fill="#1D2433" font-weight="400">实际可采用梯度累积等安排。</text><path d="M1320 440V670" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="1050" y="670" width="490" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="1074" y="734.0" font-size="26" fill="#1D2433" font-weight="600">本轮结束；是否继续？</text><path d="M1295 780V920" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="1320" y="860" font-size="22" fill="#327F78" font-weight="400">是</text><rect x="1050" y="920" width="490" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="1074" y="967.0" font-size="26" fill="#1D2433" font-weight="600">进入下一轮</text><text x="1074" y="1001.0" font-size="26" fill="#1D2433" font-weight="400">重复上方批次顺序</text><path d="M1540 725H1570V1165H1540" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="1500" y="1100" font-size="22" fill="#327F78" font-weight="400">否</text><rect x="1050" y="1110" width="490" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="1074" y="1174.0" font-size="26" fill="#1D2433" font-weight="600">结束本次训练</text><path d="M800 440V630H420V670" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="445" y="610" font-size="22" fill="#327F78" font-weight="400">到达设定保存步骤</text><rect x="60" y="670" width="720" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="84" y="717.0" font-size="26" fill="#1D2433" font-weight="600">保存检查点</text><text x="84" y="751.0" font-size="26" fill="#1D2433" font-weight="400">参数及相关训练状态</text><path d="M420 780V980" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="980" width="720" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="84" y="1027.0" font-size="26" fill="#1D2433" font-weight="600">用于恢复、比较或后续适配</text><text x="84" y="1061.0" font-size="26" fill="#1D2433" font-weight="400">不自动等于最佳模型</text><text x="60" y="1320" font-size="30" fill="#5146D9" font-weight="600">保存不要求等到一轮结束，也不意味着训练必须停止。</text><path d="M60 1390H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1429" font-size="20" fill="#565E69" font-weight="400">检查点保存由训练配置决定；可按步骤、轮次等策略触发。</text><text x="60" y="1459" font-size="20" fill="#565E69" font-weight="400">图示区分批次处理、轮次计数和状态保存，不规定所有框架的实现细节。</text></svg>