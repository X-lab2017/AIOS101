<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1310" viewBox="0 0 1600 1310" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 4-7 DeepSeek-R1 固定 README 公开的形成路径</title><desc>DeepSeek-V3-Base 分别经无预先 SFT 的直接强化学习形成 R1-Zero，经冷启动与两阶段 SFT、两阶段 RL 形成 R1。R1 生成的样本与 Qwen2.5、Llama3 微调基础共同通向六个蒸馏模型。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1310" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从数据到模型</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 4-7  DeepSeek-R1 固定 README 公开的形成路径</text><rect x="535" y="200" width="530" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="559" y="264.0" font-size="26" fill="#1D2433" font-weight="600">DeepSeek-V3-Base</text><path d="M675 310V390H300V465" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="75" y="361" font-size="21" fill="#327F78" font-weight="400">直接大规模 RL；无预先 SFT</text><path d="M925 310V390H1235V465" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="900" y="361" font-size="21" fill="#327F78" font-weight="400">冷启动数据；两阶段 SFT 与两阶段 RL</text><rect x="60" y="465" width="480" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="529.0" font-size="26" fill="#1D2433" font-weight="600">DeepSeek-R1-Zero</text><rect x="990" y="465" width="550" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="1014" y="529.0" font-size="26" fill="#1D2433" font-weight="600">DeepSeek-R1</text><path d="M1265 575V685" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="1290" y="635" font-size="21" fill="#327F78" font-weight="400">生成样本</text><rect x="990" y="685" width="550" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="1014" y="749.0" font-size="26" fill="#1D2433" font-weight="600">用于蒸馏的样本</text><rect x="60" y="685" width="390" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="749.0" font-size="26" fill="#1D2433" font-weight="600">Qwen2.5 系列</text><rect x="520" y="685" width="390" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="544" y="749.0" font-size="26" fill="#1D2433" font-weight="600">Llama3 系列</text><path d="M255 795V865H610V945" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="270" y="850" font-size="21" fill="#327F78" font-weight="400">微调基础</text><path d="M715 795V945" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="740" y="880" font-size="21" fill="#327F78" font-weight="400">微调基础</text><path d="M1265 795V865H910V945" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="1120" y="850" font-size="21" fill="#327F78" font-weight="400">用于微调</text><rect x="500" y="945" width="600" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="524" y="1009.0" font-size="26" fill="#1D2433" font-weight="600">六个蒸馏模型</text><text x="60" y="1131" font-size="28" fill="#5146D9" font-weight="600">两类上游：生成样本来源 + 被继续训练的模型基础。</text><path d="M60 1180H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1219" font-size="20" fill="#565E69" font-weight="400">来源：deepseek-ai/DeepSeek-R1 README · 0cf78561f1d51c84a21b2190626b21116d5c68bb。</text><text x="60" y="1249" font-size="20" fill="#565E69" font-weight="400">路径按文档公开概述绘制；不补写样本量、奖励设计、训练时长或阶段超参数。</text></svg>