<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 5-2　语言模型推理的最小生成循环</title><desc>假想输入今天的天气很经过预填充，依次选择晴朗与句号并加入上下文。每步计算候选、按策略选择、追加后检查结束条件；未结束则使用增长后的上下文再次计算，普通推理不更新参数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect x="0" y="0" width="1600" height="1030" rx="0" fill="#F6F3EB" stroke="#F6F3EB" stroke-width="2"/><text x="64" y="51" font-size="21" fill="#5146D9" font-weight="600" text-anchor="start">AIOS101  /  X-lab  /  自学教材</text><text x="64" y="116" font-size="39" fill="#1D2433" font-weight="700" text-anchor="start">图 5-2　语言模型推理的最小生成循环</text><text x="64" y="180" font-size="28" fill="#327F78" font-weight="400" text-anchor="start">先分词并处理已有输入（预填充），再一次次选择新 token（解码）。</text><text x="64" y="252" font-size="30" fill="#1D2433" font-weight="700" text-anchor="start">观察文本怎样增长</text><text x="1030" y="252" font-size="30" fill="#5146D9" font-weight="700" text-anchor="start">每一步怎样产生</text><path d="M64 292H872L888 316L872 340L888 364L872 388L888 412H64Z" fill="white" stroke="#BEB7DC" stroke-width="2"/><text x="89" y="331" font-size="24" fill="#626876" font-weight="400" text-anchor="start">已有输入</text><text x="89" y="382" font-size="36" fill="#5146D9" font-weight="600" text-anchor="start">今天的天气很</text><path d="M700 419v61" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="90" y="462" font-size="27" fill="#327F78" font-weight="400" text-anchor="start">选择“晴朗”</text><path d="M64 496H872L888 520L872 544L888 568L872 592L888 616H64Z" fill="white" stroke="#BEB7DC" stroke-width="2"/><text x="89" y="535" font-size="24" fill="#626876" font-weight="400" text-anchor="start">加入本步选出的片段</text><text x="89" y="586" font-size="36" fill="#327F78" font-weight="600" text-anchor="start">今天的天气很 ｜ 晴朗</text><path d="M700 623v61" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="90" y="666" font-size="27" fill="#327F78" font-weight="400" text-anchor="start">选择“。”</text><path d="M64 700H872L888 724L872 748L888 772L872 796L888 820H64Z" fill="white" stroke="#BEB7DC" stroke-width="2"/><text x="89" y="739" font-size="24" fill="#626876" font-weight="400" text-anchor="start">继续加入下一片段</text><text x="89" y="790" font-size="36" fill="#327F78" font-weight="600" text-anchor="start">今天的天气很 ｜ 晴朗 ｜ 。</text><rect x="1010" y="293" width="500" height="136" rx="10" fill="#EEEBFA" stroke="#5146D9" stroke-width="2"/><text x="1043" y="344" font-size="32" fill="#5146D9" font-weight="700" text-anchor="start">模型计算候选分布</text><text x="1043" y="389" font-size="25" fill="#1D2433" font-weight="400" text-anchor="start">使用已有参数和当前上下文</text><path d="M1260 440V485" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1040" y="531" font-size="30" fill="#1D2433" font-weight="600" text-anchor="start">生成策略选择一个 token</text><path d="M1260 550V592" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1040" y="638" font-size="30" fill="#327F78" font-weight="600" text-anchor="start">接到输出与上下文末端</text><path d="M1260 658V707" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1040" y="748" font-size="30" fill="#1D2433" font-weight="600" text-anchor="start">检查结束条件</text><path d="M1500 737H1541V361H1515" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1410" y="692" font-size="24" fill="#5146D9" font-weight="400" text-anchor="start">未结束</text><path d="M1260 770V822" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1070" y="864" font-size="27" fill="#C65D43" font-weight="600" text-anchor="start">达到条件 → 停止生成</text><text x="64" y="871" font-size="28" fill="#327F78" font-weight="600" text-anchor="start">生成的片段会影响后续；普通推理不更新参数。</text><path d="M64 901H1536" stroke="#CBC7BF" stroke-width="2" fill="none"/><text x="64" y="947" font-size="24" fill="#626876" font-weight="400" text-anchor="start">文本与分词均为教学假设，不对应特定真实分词器；“。”也不必然是结束标记。</text><text x="64" y="982" font-size="24" fill="#626876" font-weight="400" text-anchor="start">结束标记、长度上限或系统停止都可结束生成；流式服务可在结束前逐步呈现。</text></svg>