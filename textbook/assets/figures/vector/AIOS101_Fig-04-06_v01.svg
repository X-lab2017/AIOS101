<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 4-6 批次、迭代、训练轮次与检查点</title><desc>训练集分成批次，每批对应一次迭代；完整处理一轮训练集构成一个 epoch。可以继续下一轮，或按设定步骤保存参数与相关状态为检查点，用于恢复、比较或后续适配。检查点不自动等于最佳模型。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1440" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从数据到模型</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 4-6  批次、迭代、训练轮次与检查点</text><rect x="60" y="210" width="440" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="84" y="274.0" font-size="26" fill="#1D2433" font-weight="600">训练集</text><rect x="590" y="190" width="950" height="460" rx="16" fill="#EDF3EE" stroke="#327F78" stroke-width="2"/><text x="620" y="239" font-size="28" fill="#327F78" font-weight="600">一个 epoch：完整处理一轮训练集</text><rect x="620" y="310" width="275" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="644" y="357.0" font-size="26" fill="#1D2433" font-weight="600">批次 1：</text><text x="644" y="391.0" font-size="26" fill="#1D2433" font-weight="400">一次迭代</text><path d="M500 265H550V280H757V310" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M757 420V505" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="920" y="310" width="275" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="944" y="357.0" font-size="26" fill="#1D2433" font-weight="600">批次 2：</text><text x="944" y="391.0" font-size="26" fill="#1D2433" font-weight="400">一次迭代</text><path d="M500 265H550V280H1057V310" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1057 420V505" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="1220" y="310" width="275" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="1244" y="357.0" font-size="26" fill="#1D2433" font-weight="600">……直至</text><text x="1244" y="391.0" font-size="26" fill="#1D2433" font-weight="400">各批次被处理</text><path d="M500 265H550V280H1357V310" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1357 420V505" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="650" y="505" width="840" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="674" y="569.0" font-size="26" fill="#1D2433" font-weight="600">完整一轮训练集的批次被处理</text><path d="M1070 615V700" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="850" y="700" width="690" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="874" y="764.0" font-size="26" fill="#1D2433" font-weight="600">继续下一轮？</text><path d="M850 755H280V320" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="465" y="725" font-size="21" fill="#327F78" font-weight="400">是</text><rect x="60" y="945" width="850" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="1009.0" font-size="26" fill="#1D2433" font-weight="600">保存检查点：参数及相关训练状态</text><path d="M1195 810V1000H910" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="1045" y="918" font-size="21" fill="#327F78" font-weight="400">按设定步骤</text><rect x="60" y="1160" width="1480" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="84" y="1224.0" font-size="26" fill="#1D2433" font-weight="600">恢复、比较或后续适配；不等于自动选出最佳模型</text><path d="M485 1055V1160" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M60 1310H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1349" font-size="20" fill="#565E69" font-weight="400">批次组织样本；迭代计算更新；轮次按完整处理遍数计数；检查点保存阶段状态。</text><text x="60" y="1379" font-size="20" fill="#565E69" font-weight="400">包围框表示批次属于一轮，不表示各批次必须同时执行；保存步骤按训练设置确定。</text></svg>