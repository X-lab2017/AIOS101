<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 5-1 上下文容量与最大生成长度</title><desc>系统提示、历史对话、用户材料和任务组成输入上下文。上下文容量同时约束输入和新输出，最大生成长度只限制新输出，实际回答可能更短。容器面积不代表固定分配比例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1600" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从训练到推理</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 5-1  上下文容量与最大生成长度</text><rect x="60" y="210" width="680" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="274.0" font-size="26" fill="#1D2433" font-weight="600">系统提示与历史对话</text><rect x="860" y="210" width="680" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="884" y="274.0" font-size="26" fill="#1D2433" font-weight="600">用户材料与本次任务</text><path d="M400 320V410H800V465" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1200 320V410H800V465" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="470" y="465" width="660" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="494" y="529.0" font-size="26" fill="#1D2433" font-weight="600">已有输入上下文</text><path d="M800 575V665" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="665" width="1480" height="350" rx="16" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="90" y="713" font-size="32" fill="#5146D9" font-weight="600">模型与运行配置允许的上下文容量</text><rect x="90" y="755" width="680" height="215" rx="16" fill="white" stroke="#5146D9" stroke-width="2"/><text x="120" y="805" font-size="29" fill="#1D2433" font-weight="400">已有输入占用空间</text><text x="120" y="850" font-size="24" fill="#1D2433" font-weight="400">题目、材料与历史</text><rect x="800" y="755" width="710" height="215" rx="16" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="830" y="805" font-size="29" fill="#1D2433" font-weight="400">本次生成也占用相应空间</text><text x="830" y="850" font-size="24" fill="#1D2433" font-weight="400">新输出受到可用空间约束</text><rect x="860" y="1090" width="680" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="884" y="1154.0" font-size="26" fill="#1D2433" font-weight="600">最大生成长度：新输出上限</text><path d="M1200 1090V970" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="860" y="1310" width="680" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="884" y="1374.0" font-size="26" fill="#1D2433" font-weight="600">实际输出可以短于上限</text><path d="M1510 920H1565V1365H1540" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M90 1015V1150" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 6"/><rect x="60" y="1150" width="680" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="84" y="1197.0" font-size="26" fill="#1D2433" font-weight="600">输入过长会压缩可用空间</text><text x="84" y="1231.0" font-size="26" fill="#1D2433" font-weight="400">或导致请求无法按原样处理</text><text x="80" y="1100" font-size="24" fill="#D15F43" font-weight="400">不是全部留给新回答</text><path d="M60 1470H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1509" font-size="20" fill="#565E69" font-weight="400">容器面积只是概念示意，不代表固定比例；具体容量计算与超限处理由模型和运行工具决定。</text><text x="60" y="1539" font-size="20" fill="#565E69" font-weight="400">最大生成长度限制新输出；实际输出、已有输入与上下文容量应分别记录。</text></svg>