<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 5-1　上下文容量与最大生成长度</title><desc>总容量1000 token的刻度条按比例分为780个输入token和220个剩余空间。另行设置最大生成长度300不会增加总容量；保持这些输入时最多还能容纳220个新token，实际输出可以更短。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect x="0" y="0" width="1600" height="960" rx="0" fill="#F6F3EB" stroke="#F6F3EB" stroke-width="2"/><text x="64" y="51" font-size="21" fill="#5146D9" font-weight="600" text-anchor="start">AIOS101  /  X-lab  /  自学教材</text><text x="64" y="116" font-size="39" fill="#1D2433" font-weight="700" text-anchor="start">图 5-1　上下文容量与最大生成长度</text><text x="64" y="180" font-size="28" fill="#327F78" font-weight="400" text-anchor="start">假设总容量 1,000 token；全部输入已占 780，留给新输出的空间还剩多少？</text><text x="100" y="269" font-size="29" fill="#1D2433" font-weight="600" text-anchor="start">本次可用的总容量</text><text x="1500" y="269" font-size="29" fill="#5146D9" font-weight="600" text-anchor="end">1,000 token</text><rect x="100" y="320" width="1400" height="150" rx="4" fill="white" stroke="#5146D9" stroke-width="2"/><rect x="100" y="320" width="1092.0" height="150" rx="4" fill="#DCD6F6" stroke="#5146D9" stroke-width="2"/><rect x="1192.0" y="320" width="308.0" height="150" rx="4" fill="#D8ECE6" stroke="#327F78" stroke-width="2"/><text x="130" y="380" font-size="40" fill="#5146D9" font-weight="700" text-anchor="start">全部输入：780</text><text x="130" y="429" font-size="28" fill="#1D2433" font-weight="400" text-anchor="start">系统指令、历史对话、材料与本次任务</text><text x="1216.0" y="383" font-size="36" fill="#327F78" font-weight="700" text-anchor="start">剩余 220</text><text x="1216.0" y="430" font-size="25" fill="#1D2433" font-weight="400" text-anchor="start">可容纳新输出</text><path d="M100.0 475v16" stroke="#626876" stroke-width="2" fill="none"/><text x="100.0" y="523" font-size="23" fill="#626876" font-weight="400" text-anchor="middle">0</text><path d="M240.0 475v16" stroke="#626876" stroke-width="2" fill="none"/><text x="240.0" y="523" font-size="23" fill="#626876" font-weight="400" text-anchor="middle">100</text><path d="M380.0 475v16" stroke="#626876" stroke-width="2" fill="none"/><text x="380.0" y="523" font-size="23" fill="#626876" font-weight="400" text-anchor="middle">200</text><path d="M520.0 475v16" stroke="#626876" stroke-width="2" fill="none"/><text x="520.0" y="523" font-size="23" fill="#626876" font-weight="400" text-anchor="middle">300</text><path d="M660.0 475v16" stroke="#626876" stroke-width="2" fill="none"/><text x="660.0" y="523" font-size="23" fill="#626876" font-weight="400" text-anchor="middle">400</text><path d="M800.0 475v16" stroke="#626876" stroke-width="2" fill="none"/><text x="800.0" y="523" font-size="23" fill="#626876" font-weight="400" text-anchor="middle">500</text><path d="M940.0 475v16" stroke="#626876" stroke-width="2" fill="none"/><text x="940.0" y="523" font-size="23" fill="#626876" font-weight="400" text-anchor="middle">600</text><path d="M1080.0 475v16" stroke="#626876" stroke-width="2" fill="none"/><text x="1080.0" y="523" font-size="23" fill="#626876" font-weight="400" text-anchor="middle">700</text><path d="M1220.0 475v16" stroke="#626876" stroke-width="2" fill="none"/><text x="1220.0" y="523" font-size="23" fill="#626876" font-weight="400" text-anchor="middle">800</text><path d="M1360.0 475v16" stroke="#626876" stroke-width="2" fill="none"/><text x="1360.0" y="523" font-size="23" fill="#626876" font-weight="400" text-anchor="middle">900</text><path d="M1500.0 475v16" stroke="#626876" stroke-width="2" fill="none"/><text x="1500.0" y="523" font-size="23" fill="#626876" font-weight="400" text-anchor="middle">1000</text><text x="100" y="606" font-size="30" fill="#1D2433" font-weight="600" text-anchor="start">再看单独设置的“最大生成长度”</text><text x="100" y="661" font-size="36" fill="#C65D43" font-weight="700" text-anchor="start">设置为 300</text><text x="470" y="660" font-size="34" fill="#C65D43" font-weight="700" text-anchor="start">≠  一定能写 300</text><text x="100" y="732" font-size="30" fill="#1D2433" font-weight="400" text-anchor="start">若保持这些输入和总容量，空间上最多还能容纳 220 个新 token。</text><text x="100" y="786" font-size="29" fill="#327F78" font-weight="400" text-anchor="start">即使空间允许，遇到结束条件时，实际输出也可能更短。</text><path d="M64 831H1536" stroke="#CBC7BF" stroke-width="2" fill="none"/><text x="64" y="877" font-size="24" fill="#626876" font-weight="400" text-anchor="start">容量条按本例 780∶220 精确绘制；不代表某款真实产品的固定额度。</text><text x="64" y="912" font-size="24" fill="#626876" font-weight="400" text-anchor="start">超限时拒绝、截短或调整预算由实现决定；token 数不等于汉字数。</text></svg>