<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 5-3 生成 top-k 与 top-p 的简化对照</title><desc>教学候选晴朗、寒冷、温暖、潮湿、安静的概率为 0.55、0.25、0.12、0.05、0.03。top-k 等于 2 保留前两项，top-p 等于 0.90 保留累计达到 0.92 的前三项，再在保留集合内选择。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1420" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从训练到推理</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 5-3  生成 top-k 与 top-p 的简化对照</text><text x="60" y="170" font-size="24" fill="#D15F43" font-weight="600">教学示意 · 给定前文“今天的天气很”，以下不是实际天气或模型运行结果。</text><text x="60" y="272" font-size="30" fill="#1D2433" font-weight="400">晴朗</text><rect x="220" y="240" width="605.0" height="55" rx="4" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="850.0" y="278" font-size="26" fill="#1D2433" font-weight="400">0.55</text><text x="60" y="392" font-size="30" fill="#1D2433" font-weight="400">寒冷</text><rect x="220" y="360" width="275.0" height="55" rx="4" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="520.0" y="398" font-size="26" fill="#1D2433" font-weight="400">0.25</text><text x="60" y="512" font-size="30" fill="#1D2433" font-weight="400">温暖</text><rect x="220" y="480" width="132.0" height="55" rx="4" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="377.0" y="518" font-size="26" fill="#1D2433" font-weight="400">0.12</text><text x="60" y="632" font-size="30" fill="#1D2433" font-weight="400">潮湿</text><rect x="220" y="600" width="55.0" height="55" rx="4" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="300.0" y="638" font-size="26" fill="#1D2433" font-weight="400">0.05</text><text x="60" y="752" font-size="30" fill="#1D2433" font-weight="400">安静</text><rect x="220" y="720" width="33.0" height="55" rx="4" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="278.0" y="758" font-size="26" fill="#1D2433" font-weight="400">0.03</text><path d="M1050 240H1010V415H1050" stroke="#327F78" stroke-width="3" fill="none" /><text x="1080" y="285" font-size="30" fill="#327F78" font-weight="600">top-k＝2</text><text x="1080" y="333" font-size="25" fill="#1D2433" font-weight="400">保留晴朗＋寒冷</text><text x="1080" y="380" font-size="23" fill="#1D2433" font-weight="400">按固定数量截取</text><path d="M920 240H880V535H920" stroke="#D15F43" stroke-width="3" fill="none" /><text x="1080" y="495" font-size="30" fill="#D15F43" font-weight="600">top-p＝0.90</text><text x="1080" y="543" font-size="25" fill="#1D2433" font-weight="400">保留前三项</text><text x="1080" y="587" font-size="22" fill="#1D2433" font-weight="400">0.55＋0.25＋0.12</text><text x="1080" y="632" font-size="25" fill="#1D2433" font-weight="400">累计 0.92 ≥ 0.90</text><rect x="60" y="890" width="1480" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="84" y="954.0" font-size="26" fill="#1D2433" font-weight="600">在保留集合内继续选择</text><path d="M1230 405V820H900V890" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1230 660V855H1050V890" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="1110" width="1480" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="84" y="1174.0" font-size="26" fill="#1D2433" font-weight="600">仍不保证事实正确；第六章检索 top-k 的对象是文档片段</text><path d="M800 1000V1110" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M60 1290H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1329" font-size="20" fill="#565E69" font-weight="400">top-k 按候选数量保留；top-p 按累计概率保留达到阈值的最小集合。</text><text x="60" y="1359" font-size="20" fill="#565E69" font-weight="400">保留集合后的具体采样与概率归一化依实现而定；候选概率不是事实正确率。</text></svg>