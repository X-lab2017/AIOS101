<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 4-5 一次训练迭代的基本循环</title><desc>读取一批样本，使用当前参数处理输入，得到候选分布，计算损失，通过反向传播估计梯度，由优化器按学习率等设置更新参数，再进入下一批样本，形成循环。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1040" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从数据到模型</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 4-5  一次训练迭代的基本循环</text><text x="60" y="172" font-size="26" fill="#327F78" font-weight="400">从一批样本开始，计算误差，再更新参数。</text><rect x="70" y="230" width="410" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="94" y="294.0" font-size="26" fill="#1D2433" font-weight="600">读取一批训练样本</text><text x="76" y="215" font-size="19" fill="#5146D9" font-weight="400">01</text><rect x="590" y="230" width="420" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="614" y="277.0" font-size="26" fill="#1D2433" font-weight="600">根据当前参数</text><text x="614" y="311.0" font-size="26" fill="#1D2433" font-weight="400">处理输入</text><text x="596" y="215" font-size="19" fill="#5146D9" font-weight="400">02</text><rect x="1120" y="230" width="410" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="1144" y="277.0" font-size="26" fill="#1D2433" font-weight="600">得到预测</text><text x="1144" y="311.0" font-size="26" fill="#1D2433" font-weight="400">或候选分布</text><text x="1126" y="215" font-size="19" fill="#5146D9" font-weight="400">03</text><rect x="1120" y="490" width="410" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="1144" y="537.0" font-size="26" fill="#1D2433" font-weight="600">计算预测与训练目标</text><text x="1144" y="571.0" font-size="26" fill="#1D2433" font-weight="400">之间的损失</text><text x="1126" y="475" font-size="19" fill="#5146D9" font-weight="400">04</text><rect x="1120" y="750" width="410" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="1144" y="797.0" font-size="26" fill="#1D2433" font-weight="600">通过反向传播</text><text x="1144" y="831.0" font-size="26" fill="#1D2433" font-weight="400">估计梯度</text><text x="1126" y="735" font-size="19" fill="#5146D9" font-weight="400">05</text><rect x="590" y="750" width="420" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="614" y="797.0" font-size="26" fill="#1D2433" font-weight="600">优化器按学习率等</text><text x="614" y="831.0" font-size="26" fill="#1D2433" font-weight="400">设置更新参数</text><text x="596" y="735" font-size="19" fill="#5146D9" font-weight="400">06</text><rect x="70" y="750" width="410" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="94" y="814.0" font-size="26" fill="#1D2433" font-weight="600">进入下一批样本</text><text x="76" y="735" font-size="19" fill="#5146D9" font-weight="400">07</text><path d="M480 285H590" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1010 285H1120" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1325 340V490" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1325 600V750" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1120 805H1010" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M590 805H480" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M275 750V340" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="525" y="505" font-size="38" fill="#5146D9" font-weight="700">训练的闭环</text><text x="525" y="563" font-size="26" fill="#1D2433" font-weight="400">预测 → 损失 → 梯度 → 更新</text><text x="525" y="617" font-size="23" fill="#1D2433" font-weight="400">参数改变，下一批计算使用新的数值。</text><path d="M60 910H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="949" font-size="20" fill="#565E69" font-weight="400">最小机制示意；实际系统还包含数据调度、并行计算、检查点与监测。</text><text x="60" y="979" font-size="20" fill="#565E69" font-weight="400">普通推理使用已有参数，不自动进入这个参数更新循环。</text></svg>