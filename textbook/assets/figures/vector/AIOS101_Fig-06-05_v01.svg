<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 6-5 工具调用的最小闭环</title><desc>编排组织上下文与工具说明，模型可直接返回文本或提出调用请求。请求接受格式、参数和权限检查；获准后外部程序执行并返回结果或错误，不获准则拒绝或等待人工确认。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1420" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从模型到智能体</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 6-5  工具调用的最小闭环</text><rect x="60" y="200" width="670" height="850" rx="16" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><rect x="810" y="200" width="730" height="850" rx="16" fill="#EDF3EE" stroke="#327F78" stroke-width="2"/><text x="90" y="245" font-size="26" fill="#5146D9" font-weight="600">模型与上下文</text><text x="840" y="245" font-size="26" fill="#327F78" font-weight="600">外部程序与控制</text><rect x="90" y="290" width="600" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="114" y="354.0" font-size="26" fill="#1D2433" font-weight="600">用户任务</text><rect x="90" y="490" width="600" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="114" y="537.0" font-size="26" fill="#1D2433" font-weight="600">编排程序组织</text><text x="114" y="571.0" font-size="26" fill="#1D2433" font-weight="400">上下文与工具说明</text><path d="M390 400V490" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="90" y="700" width="600" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="114" y="764.0" font-size="26" fill="#1D2433" font-weight="600">模型生成</text><path d="M390 600V700" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="90" y="1120" width="600" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="114" y="1184.0" font-size="26" fill="#1D2433" font-weight="600">返回用户</text><path d="M390 810V1120" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="415" y="1000" font-size="21" fill="#327F78" font-weight="400">文本回答</text><rect x="850" y="700" width="650" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="874" y="764.0" font-size="26" fill="#1D2433" font-weight="600">权限、格式与参数检查</text><path d="M690 755H850" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="702" y="719" font-size="21" fill="#327F78" font-weight="400">调用请求</text><text x="850" y="673" font-size="21" fill="#327F78" font-weight="400">工具名称与参数</text><rect x="850" y="1120" width="650" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="874" y="1184.0" font-size="26" fill="#1D2433" font-weight="600">告知用户或请求人工决定</text><path d="M1175 810V1120" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="1200" y="1000" font-size="21" fill="#327F78" font-weight="400">拒绝或需确认</text><rect x="850" y="400" width="650" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="874" y="464.0" font-size="26" fill="#1D2433" font-weight="600">外部工具实际运行</text><path d="M1175 700V510" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="1200" y="600" font-size="21" fill="#327F78" font-weight="400">获准执行</text><path d="M850 455H775V545H690" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="500" y="445" font-size="21" fill="#327F78" font-weight="400">结果、错误或超时</text><path d="M60 1290H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1329" font-size="20" fill="#565E69" font-weight="400">模型生成调用请求，外部程序才是执行主体；请求本身不能证明行动已发生。</text><text x="60" y="1359" font-size="20" fill="#565E69" font-weight="400">检查未通过时拒绝或请求人工决定；工具错误与超时同样应返回编排。</text></svg>