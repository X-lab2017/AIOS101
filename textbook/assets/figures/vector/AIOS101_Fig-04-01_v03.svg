oke-width="2"/><rect x="1346" y="494" width="29" height="29" rx="2" fill="#C6BFE9" stroke="#5146D9" stroke-width="2"/><rect x="1386" y="494" width="29" height="29" rx="2" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><rect x="1266" y="534" width="29" height="29" rx="2" fill="#327F78" stroke="#5146D9" stroke-width="2"/><rect x="1306" y="534" width="29" height="29" rx="2" fill="#9ABCB7" stroke="#5146D9" stroke-width="2"/><rect x="1346" y="534" width="29" height="29" rx="2" fill="#327F78" stroke="#5146D9" stroke-width="2"/><rect x="1386" y="534" width="29" height="29" rx="2" fill="#9ABCB7" stroke="#5146D9" stroke-width="2"/><text x="1230" y="607" font-size="24" fill="#1D2433" font-weight="400" text-anchor="start">学习留下的数值状态</text><rect x="620" y="731" width="430" height="111" rx="8" fill="#E5F0EB" stroke="#327F78" stroke-width="2"/><text x="650" y="777" font-size="31" fill="#327F78" font-weight="700" text-anchor="start">算力与软件环境</text><text x="650" y="818" font-size="26" fill="#1D2433" font-weight="400" text-anchor="start">支持上述计算实际执行</text><path d="M835 731V680" stroke="#327F78" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1050 650H1120V717H1350V654" stroke="#327F78" stroke-width="3" fill="none" stroke-dasharray="9 7"/><text x="1180" y="775" font-size="27" fill="#1D2433" font-weight="400" text-anchor="start">结构与参数共同构成</text><text x="1180" y="818" font-size="27" fill="#327F78" font-weight="600" text-anchor="start">可运行模型的核心</text><path d="M64 891H1536" stroke="#CBC7BF" stroke-width="2" fill="none"/><text x="64" y="937" font-size="24" fill="#626876" font-weight="400" text-anchor="start">结构规定怎样计算；参数是计算中可被训练调整的数值。</text><text x="64" y="972" font-size="24" fill="#626876" font-weight="400" text-anchor="start">参数格子仅作示意，不表示真实权重；训练结果还受数据与设置影响。</text></svg>