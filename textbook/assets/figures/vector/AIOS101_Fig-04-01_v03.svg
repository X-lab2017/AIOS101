<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 4-1　模型形成的基本要素</title><desc>数据和学习规则进入训练工作台，模型结构容纳初始或已有参数，算力与软件环境支持计算。训练改变参数状态，结构与参数共同构成可运行模型的核心。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect x="0" y="0" width="1600" height="1020" rx="0" fill="#F6F3EB" stroke="#F6F3EB" stroke-width="2"/><text x="64" y="51" font-size="21" fill="#5146D9" font-weight="600" text-anchor="start">AIOS101  /  X-lab  /  自学教材</text><text x="64" y="116" font-size="39" fill="#1D2433" font-weight="700" text-anchor="start">图 4-1　模型形成的基本要素</text><text x="64" y="180" font-size="29" fill="#327F78" font-weight="400" text-anchor="start">材料、计算形式、更新规则与资源，怎样在同一个过程中相遇？</text><text x="90" y="259" font-size="34" fill="#5146D9" font-weight="700" text-anchor="start">数据</text><text x="90" y="300" font-size="27" fill="#1D2433" font-weight="400" text-anchor="start">按任务组织的样本</text><rect x="102" y="350" width="260" height="130" rx="3" fill="#FFFFFF" stroke="#AAA1DE" stroke-width="2"/><path d="M125 381h200 M125 410h140" stroke="#AAA1DE" stroke-width="3" fill="none"/><rect x="119" y="365" width="260" height="130" rx="3" fill="#FFFFFF" stroke="#AAA1DE" stroke-width="2"/><path d="M142 396h200 M142 425h140" stroke="#AAA1DE" stroke-width="3" fill="none"/><rect x="136" y="380" width="260" height="130" rx="3" fill="#FFFFFF" stroke="#AAA1DE" stroke-width="2"/><path d="M159 411h200 M159 440h140" stroke="#AAA1DE" stroke-width="3" fill="none"/><text x="90" y="573" font-size="34" fill="#327F78" font-weight="700" text-anchor="start">目标与学习算法</text><text x="90" y="617" font-size="26" fill="#1D2433" font-weight="400" text-anchor="start">比较差距，决定怎样更新</text><path d="M108 665h235" stroke="#327F78" stroke-width="2" fill="none"/><circle cx="278" cy="665" r="9" fill="#327F78"/><path d="M108 704h235" stroke="#327F78" stroke-width="2" fill="none"/><circle cx="218" cy="704" r="9" fill="#327F78"/><path d="M108 743h235" stroke="#327F78" stroke-width="2" fill="none"/><circle cx="313" cy="743" r="9" fill="#327F78"/><path d="M410 415H550V460H620" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M410 678H550V550H620" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="620" y="293" width="430" height="380" rx="8" fill="#EFECFA" stroke="#5146D9" stroke-width="2"/><text x="654" y="341" font-size="31" fill="#5146D9" font-weight="700" text-anchor="start">模型结构：组织计算</text><rect x="675" y="385" width="31" height="31" rx="2" fill="#C8C2EC" stroke="#5146D9" stroke-width="2"/><rect x="718" y="385" width="31" height="31" rx="2" fill="#E0DCF4" stroke="#5146D9" stroke-width="2"/><rect x="761" y="385" width="31" height="31" rx="2" fill="#A79DDE" stroke="#5146D9" stroke-width="2"/><rect x="804" y="385" width="31" height="31" rx="2" fill="#C8C2EC" stroke="#5146D9" stroke-width="2"/><rect x="675" y="428" width="31" height="31" rx="2" fill="#E0DCF4" stroke="#5146D9" stroke-width="2"/><rect x="718" y="428" width="31" height="31" rx="2" fill="#A79DDE" stroke="#5146D9" stroke-width="2"/><rect x="761" y="428" width="31" height="31" rx="2" fill="#C8C2EC" stroke="#5146D9" stroke-width="2"/><rect x="804" y="428" width="31" height="31" rx="2" fill="#E0DCF4" stroke="#5146D9" stroke-width="2"/><rect x="675" y="471" width="31" height="31" rx="2" fill="#A79DDE" stroke="#5146D9" stroke-width="2"/><rect x="718" y="471" width="31" height="31" rx="2" fill="#C8C2EC" stroke="#5146D9" stroke-width="2"/><rect x="761" y="471" width="31" height="31" rx="2" fill="#E0DCF4" stroke="#5146D9" stroke-width="2"/><rect x="804" y="471" width="31" height="31" rx="2" fill="#A79DDE" stroke="#5146D9" stroke-width="2"/><rect x="675" y="514" width="31" height="31" rx="2" fill="#C8C2EC" stroke="#5146D9" stroke-width="2"/><rect x="718" y="514" width="31" he