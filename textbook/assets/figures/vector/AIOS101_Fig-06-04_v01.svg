<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1530" viewBox="0 0 1600 1530" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 6-4 检索增强生成的基本流程</title><desc>资料准备通道将外部文档切分并索引；问题通道形成查询，检索 top-k 带来源片段，经筛选排序进入上下文，与问题一起供模型生成可核查的回答。索引不进入训练参数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1530" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从模型到智能体</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 6-4  检索增强生成的基本流程</text><text x="60" y="180" font-size="27" fill="#327F78" font-weight="600">资料准备</text><text x="1020" y="180" font-size="27" fill="#5146D9" font-weight="600">运行时问题</text><rect x="60" y="220" width="700" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="284.0" font-size="26" fill="#1D2433" font-weight="600">外部文档</text><rect x="60" y="410" width="700" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="474.0" font-size="26" fill="#1D2433" font-weight="600">切分与必要处理</text><rect x="60" y="600" width="700" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="664.0" font-size="26" fill="#1D2433" font-weight="600">建立关键词或向量等索引</text><path d="M410 330V410" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M410 520V600" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="1020" y="220" width="520" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="1044" y="284.0" font-size="26" fill="#1D2433" font-weight="600">用户问题</text><rect x="1020" y="600" width="520" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="1044" y="664.0" font-size="26" fill="#1D2433" font-weight="600">形成查询并检索</text><path d="M760 655H1020" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1280 330V600" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="1020" y="820" width="520" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="1044" y="867.0" font-size="26" fill="#1D2433" font-weight="600">top-k 候选片段</text><text x="1044" y="901.0" font-size="26" fill="#1D2433" font-weight="400">及来源信息</text><path d="M1280 710V820" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="820" width="700" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="884.0" font-size="26" fill="#1D2433" font-weight="600">筛选、排序并组织上下文</text><path d="M1020 875H760" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="1040" width="700" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="84" y="1104.0" font-size="26" fill="#1D2433" font-weight="600">模型结合问题与片段生成</text><path d="M410 930V1040" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1540 275H1570V1095H760" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="1050" y="1012" font-size="21" fill="#327F78" font-weight="400">问题直接进入生成上下文</text><rect x="60" y="1240" width="700" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="84" y="1304.0" font-size="26" fill="#1D2433" font-weight="600">回答及可核查引用</text><path d="M410 1150V1240" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="900" y="1290" font-size="32" fill="#5146D9" font-weight="700">检索 ≠ 重新训练</text><path d="M60 1400H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1439" font-size="20" fill="#565E69" font-weight="400">索引服务查找，带来源片段进入运行时上下文；箭头不表示训练或参数更新。</text><text x="60" y="1469" font-size="20" fill="#565E69" font-weight="400">这里的 top-k 指文档候选片段数量；找到片段仍需筛选与核查。</text></svg>