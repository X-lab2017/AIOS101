<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1830" viewBox="0 0 1600 1830" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 6-10 人机协作中的关键检查点</title><desc>任务必要性决定是否需要工具；检索与生成配合最小权限、输入检查，敏感、对外或不可逆动作进入人工确认或禁止，之后核验证据与停止条件，最终交付来源、日志和责任说明。禁止的动作不执行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1830" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从模型到智能体</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 6-10  人机协作中的关键检查点</text><rect x="60" y="205" width="500" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="269.0" font-size="26" fill="#1D2433" font-weight="600">提出任务</text><path d="M310 315V400" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="400" width="720" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="84" y="464.0" font-size="26" fill="#1D2433" font-weight="600">资料与权限是否必要且合适？</text><rect x="960" y="400" width="580" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="984" y="464.0" font-size="26" fill="#1D2433" font-weight="600">缩小范围、拒绝或请人决定</text><path d="M780 455H960" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="845" y="431" font-size="21" fill="#327F78" font-weight="400">否</text><rect x="60" y="620" width="720" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="684.0" font-size="26" fill="#1D2433" font-weight="600">检索、生成与工具步骤</text><path d="M420 510V620" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="450" y="578" font-size="21" fill="#327F78" font-weight="400">是</text><rect x="60" y="840" width="720" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="84" y="887.0" font-size="26" fill="#1D2433" font-weight="600">是否涉及敏感数据、</text><text x="84" y="921.0" font-size="26" fill="#1D2433" font-weight="400">对外影响或不可逆动作？</text><path d="M420 730V840" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="960" y="840" width="580" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="984" y="887.0" font-size="26" fill="#1D2433" font-weight="600">展示动作与后果，</text><text x="984" y="921.0" font-size="26" fill="#1D2433" font-weight="400">人工确认或禁止</text><path d="M780 895H960" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="845" y="871" font-size="21" fill="#327F78" font-weight="400">是</text><rect x="60" y="1080" width="720" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="1144.0" font-size="26" fill="#1D2433" font-weight="600">自动检查与结果核验</text><path d="M420 950V1080" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="450" y="1020" font-size="21" fill="#327F78" font-weight="400">否</text><path d="M1250 950V1135H780" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="1300" width="720" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="84" y="1364.0" font-size="26" fill="#1D2433" font-weight="600">证据充分且未触及停止条件？</text><path d="M420 1190V1300" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="960" y="1300" width="580" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="984" y="1347.0" font-size="26" fill="#1D2433" font-weight="600">停止、修订、求助</text><text x="984" y="1381.0" font-size="26" fill="#1D2433" font-weight="400">或保留未完成事项</text><path d="M780 1355H960" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="845" y="1331" font-size="21" fill="#327F78" font-weight="400">否</text><rect x="60" y="1520" width="720" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="84" y="1584.0" font-size="26" fill="#1D2433" font-weight="600">交付结果、来源、日志与责任说明</text><path d="M420 1410V1520" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="450" y="1480" font-size="21" fill="#327F78" font-weight="400">是</text><text x="970" y="1555" font-size="27" fill="#5146D9" font-weight="600">人工判断 + 技术约束</text><text x="970" y="1605" font-size="22" fill="#1D2433" font-weight="400">禁止执行不等于仍可继续动作。</text><path d="M60 1700H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1739" font-size="20" fill="#565E69" font-weight="400">按当前正文 Mermaid 保留检查节点；“禁止”对应不执行该动作，后续只核验与报告状态。</text><text x="60" y="1769" font-size="20" fill="#565E69" font-weight="400">人工确认不能代替最小权限、输入校验、日志与停止条件。</text></svg>