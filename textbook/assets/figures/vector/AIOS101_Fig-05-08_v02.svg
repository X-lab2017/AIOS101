<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1430" viewBox="0 0 1600 1430" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 5-8 最小评价的证据链</title><desc>评价证据链依次为定义任务和使用者、固定样本范围、确定基线、选择指标、记录完整配置、重复运行并保留失败、解释有限结论和后续改进。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1430" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从训练到推理</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 5-8  最小评价的证据链</text><text x="60" y="170" font-size="27" fill="#327F78" font-weight="400">评价是一份证据档案，不是给模型贴一个总分。</text><rect x="60" y="225" width="1480" height="120" rx="16" fill="white" stroke="#D7D3C9" stroke-width="2"/><circle cx="120" cy="285" r="27" fill="#5146D9"/><text x="110" y="294" font-size="24" fill="white" font-weight="600">1</text><text x="185" y="276" font-size="29" fill="#1D2433" font-weight="600">定义真实任务与使用者</text><text x="185" y="317" font-size="23" fill="#1D2433" font-weight="400">先明确要帮助谁、完成什么</text><path d="M120 313V375" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="375" width="1480" height="120" rx="16" fill="white" stroke="#D7D3C9" stroke-width="2"/><circle cx="120" cy="435" r="27" fill="#5146D9"/><text x="110" y="444" font-size="24" fill="white" font-weight="600">2</text><text x="185" y="426" font-size="29" fill="#1D2433" font-weight="600">固定样本与覆盖范围</text><text x="185" y="467" font-size="23" fill="#1D2433" font-weight="400">保留输入、来源和未覆盖范围</text><path d="M120 463V525" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="525" width="1480" height="120" rx="16" fill="white" stroke="#D7D3C9" stroke-width="2"/><circle cx="120" cy="585" r="27" fill="#5146D9"/><text x="110" y="594" font-size="24" fill="white" font-weight="600">3</text><text x="185" y="576" font-size="29" fill="#1D2433" font-weight="600">确定基线与比较条件</text><text x="185" y="617" font-size="23" fill="#1D2433" font-weight="400">建立可解释的比较起点</text><path d="M120 613V675" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="675" width="1480" height="120" rx="16" fill="white" stroke="#D7D3C9" stroke-width="2"/><circle cx="120" cy="735" r="27" fill="#5146D9"/><text x="110" y="744" font-size="24" fill="white" font-weight="600">4</text><text x="185" y="726" font-size="29" fill="#1D2433" font-weight="600">选择匹配任务的指标</text><text x="185" y="767" font-size="23" fill="#1D2433" font-weight="400">衡量任务所需的具体表现</text><path d="M120 763V825" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="825" width="1480" height="120" rx="16" fill="white" stroke="#D7D3C9" stroke-width="2"/><circle cx="120" cy="885" r="27" fill="#5146D9"/><text x="110" y="894" font-size="24" fill="white" font-weight="600">5</text><text x="185" y="876" font-size="29" fill="#1D2433" font-weight="600">记录模型、提示与系统配置</text><text x="185" y="917" font-size="23" fill="#1D2433" font-weight="400">让结果绑定可检查的条件</text><path d="M120 913V975" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="975" width="1480" height="120" rx="16" fill="white" stroke="#D7D3C9" stroke-width="2"/><circle cx="120" cy="1035" r="27" fill="#5146D9"/><text x="110" y="1044" font-size="24" fill="white" font-weight="600">6</text><text x="185" y="1026" font-size="29" fill="#1D2433" font-weight="600">重复运行并保留失败</text><text x="185" y="1067" font-size="23" fill="#1D2433" font-weight="400">保留截断、异常和失败类型</text><path d="M120 1063V1125" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="1125" width="1480" height="120" rx="16" fill="white" stroke="#D7D3C9" stroke-width="2"/><circle cx="120" cy="1185" r="27" fill="#5146D9"/><text x="110" y="1194" font-size="24" fill="white" font-weight="600">7</text><text x="185" y="1176" font-size="29" fill="#1D2433" font-weight="600">解释结果、边界与后续改进</text><text x="185" y="1217" font-size="23" fill="#1D2433" font-weight="400">形成适用范围明确的结论</text><path d="M60 1300H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1339" font-size="20" fill="#565E69" font-weight="400">每一步保留可核查证据，使评价条件与结论对应。</text><text x="60" y="1369" font-size="20" fill="#565E69" font-weight="400">从任务开始，不从挑选现成榜单开始；不把不同指标合成“综合智能总分”。</text></svg>