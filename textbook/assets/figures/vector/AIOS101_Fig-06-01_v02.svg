<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 6-1 从模型到任务系统的基本组成</title><desc>检索证据进入上下文；模型提出调用请求，外部程序承担实际执行。；这是角色关系示意，不表示某款产品的实际架构；资料、模型参数与工具结果不能混同。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1440" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从模型到智能体</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 6-1  从模型到任务系统的基本组成</text><rect x="480" y="200" width="640" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="504" y="264.0" font-size="26" fill="#1D2433" font-weight="600">人：目标、约束、授权与核验</text><rect x="480" y="480" width="640" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="504" y="544.0" font-size="26" fill="#1D2433" font-weight="600">任务编排与状态</text><path d="M670 310V480" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="485" y="410" font-size="22" fill="#327F78" font-weight="400">目标与权限</text><path d="M950 480V310" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="980" y="410" font-size="22" fill="#327F78" font-weight="400">结果与待确认项</text><rect x="60" y="810" width="440" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="874.0" font-size="26" fill="#1D2433" font-weight="600">外部文档与数据</text><rect x="60" y="1060" width="440" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="1124.0" font-size="26" fill="#1D2433" font-weight="600">检索器与索引</text><rect x="580" y="1060" width="510" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="604" y="1107.0" font-size="26" fill="#1D2433" font-weight="600">模型：生成回答、</text><text x="604" y="1141.0" font-size="26" fill="#1D2433" font-weight="400">计划或调用请求</text><rect x="1190" y="810" width="350" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="1214" y="874.0" font-size="26" fill="#1D2433" font-weight="600">工具与外部程序</text><path d="M280 920V1060" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="305" y="1005" font-size="22" fill="#327F78" font-weight="400">建索引</text><path d="M480 535H30V1115H60" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="65" y="725" font-size="23" fill="#327F78" font-weight="400">编排发起检索</text><path d="M500 1115H580" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="80" y="1240" font-size="25" fill="#327F78" font-weight="400">检索片段 → 模型上下文证据</text><path d="M710 590V1060" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="540" y="720" font-size="22" fill="#327F78" font-weight="400">组织上下文</text><path d="M960 1060V590" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="975" y="990" font-size="22" fill="#327F78" font-weight="400">回答／计划／调用请求</text><path d="M1120 520H1355V810" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="1140" y="675" font-size="22" fill="#327F78" font-weight="400">经权限检查后执行</text><path d="M1540 865H1570V420H1120V480" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="1180" y="380" font-size="22" fill="#327F78" font-weight="400">执行结果或错误</text><path d="M60 1310H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1349" font-size="20" fill="#565E69" font-weight="400">检索证据进入上下文；模型提出调用请求，外部程序承担实际执行。</text><text x="60" y="1379" font-size="20" fill="#565E69" font-weight="400">这是角色关系示意，不表示某款产品的实际架构；资料、模型参数与工具结果不能混同。</text></svg>