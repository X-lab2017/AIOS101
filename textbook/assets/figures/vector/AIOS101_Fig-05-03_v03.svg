<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 5-3　生成 top-k 与 top-p 的简化对照</title><desc>候选概率晴朗0.55、寒冷0.25、温暖0.12、潮湿0.05、安静0.03。top-k等于2保留前两项，归一化为68.75%和31.25%；top-p等于0.90保留累计0.92的前三项，归一化约59.8%、27.2%、13.0%。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#F6F3EB" stroke="#F6F3EB" stroke-width="2"/><text x="64" y="51" font-size="21" fill="#5146D9" font-weight="600" text-anchor="start">AIOS101  /  X-lab  /  自学教材</text><text x="64" y="116" font-size="39" fill="#1D2433" font-weight="700" text-anchor="start">图 5-3　生成 top-k 与 top-p 的简化对照</text><text x="64" y="179" font-size="28" fill="#327F78" font-weight="400" text-anchor="start">同一组教学候选：先筛选保留项，再把保留项重新缩放到合计 100%。</text><text x="64" y="249" font-size="30" fill="#1D2433" font-weight="700" text-anchor="start">原始候选概率</text><text x="920" y="249" font-size="30" fill="#1D2433" font-weight="700" text-anchor="start">按概率从高到低累计</text><text x="64" y="326" font-size="28" fill="#1D2433" font-weight="400" text-anchor="start">晴朗</text><rect x="175" y="298" width="610.0" height="34" rx="3" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="800" y="326" font-size="27" fill="#5146D9" font-weight="400" text-anchor="start">0.55</text><text x="925" y="326" font-size="27" fill="#626876" font-weight="400" text-anchor="start">0.55</text><text x="64" y="386" font-size="28" fill="#1D2433" font-weight="400" text-anchor="start">寒冷</text><rect x="175" y="358" width="277.27272727272725" height="34" rx="3" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="800" y="386" font-size="27" fill="#5146D9" font-weight="400" text-anchor="start">0.25</text><text x="925" y="386" font-size="27" fill="#626876" font-weight="400" text-anchor="start">0.80</text><text x="1040" y="386" font-size="25" fill="#626876" font-weight="400" text-anchor="start">前 2 项：0.80 ＜ 0.90</text><text x="64" y="446" font-size="28" fill="#1D2433" font-weight="400" text-anchor="start">温暖</text><rect x="175" y="418" width="133.0909090909091" height="34" rx="3" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="800" y="446" font-size="27" fill="#5146D9" font-weight="400" text-anchor="start">0.12</text><text x="925" y="446" font-size="27" fill="#327F78" font-weight="400" text-anchor="start">0.92</text><text x="1040" y="446" font-size="25" fill="#327F78" font-weight="600" text-anchor="start">前 3 项：0.92 ≥ 0.90</text><text x="64" y="506" font-size="28" fill="#1D2433" font-weight="400" text-anchor="start">潮湿</text><rect x="175" y="478" width="55.45454545454545" height="34" rx="3" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="800" y="506" font-size="27" fill="#5146D9" font-weight="400" text-anchor="start">0.05</text><text x="925" y="506" font-size="27" fill="#626876" font-weight="400" text-anchor="start">0.97</text><text x="64" y="566" font-size="28" fill="#1D2433" font-weight="400" text-anchor="start">安静</text><rect x="175" y="538" width="33.27272727272727" height="34" rx="3" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="800" y="566" font-size="27" fill="#5146D9" font-weight="400" text-anchor="start">0.03</text><text x="925" y="566" font-size="27" fill="#626876" font-weight="400" text-anchor="start">1.00</text><path d="M64 648h705" stroke="#5146D9" stroke-width="4" fill="none"/><text x="64" y="699" font-size="33" fill="#5146D9" font-weight="700" text-anchor="start">top-k＝2：固定数量</text><path d="M830 648h705" stroke="#327F78" stroke-width="4" fill="none"/><text x="830" y="699" font-size="33" fill="#327F78" font-weight="700" text-anchor="start">top-p＝0.90：累计阈值</text><text x="64" y="751" font-size="27" fill="#1D2433" font-weight="400" text-anchor="start">保留晴朗、寒冷；原概率合计 0.80。</text><text x="64" y="813" font-size="30" fill="#5146D9" font-weight="600" text-anchor="start">晴朗：0.55 ÷ 0.80＝68.75%</text><text x="64" y="865" font-size="30" fill="#5146D9" font-weight="600" text-anchor="start">寒冷：0.25 ÷ 0.80＝31.25%</text><text x="64" y="927" font-size="27" fill="#626876" font-weight="400" text-anchor="start">两项重新合计 100%，不是各占一半。</text><text x="830" y="751" font-size="27" fill="#1D2433" font-weight="400" text-anchor="start">保留前三项；原概率合计 0.92。</text><text x="830" y="808" font-size="28" fill="#327F78" font-weight="600" text-anchor="start">晴朗：0.55 ÷ 0.92 ≈ 59.8%</text><text x="830" y="856" font-size="28" fill="#327F78" font-weight="600" text-anchor="start">寒冷：0.25 ÷ 0.92 ≈ 27.2%</text><text x="830" y="904" font-size="28" fill="#327F78" font-weight="600" text-anchor="start">温暖：0.12 ÷ 0.92 ≈ 13.0%</text><text x="830" y="951" font-size="25" fill="#626876" font-weight="400" text-anchor="start">按一位小数显示，仍保留原来的相对比例。</text><path d="M64 991H1536" stroke="#CBC7BF" stroke-width="2" fill="none"/><text x="64" y="1037" font-size="24" fill="#626876" font-weight="400" text-anchor="start">这些是选择 token 的概率，不是天气事实正确率；没有连接真实天气观测。</text><text x="64" y="1072" font-size="24" fill="#626876" font-weight="400" text-anchor="start">图中分别比较两种筛选；温度、其他限制与组合顺序须按具体实现另行核对。</text></svg>