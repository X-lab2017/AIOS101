<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 5-3 生成 top-k 与 top-p 的简化对照</title><desc>top-k 按候选数量保留；top-p 按累计概率保留达到阈值的最小集合。；第六章的检索 top-k 则表示文档候选片段数量，两者对象不同。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1400" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从训练到推理</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 5-3  生成 top-k 与 top-p 的简化对照</text><text x="60" y="175" font-size="25" fill="#D15F43" font-weight="600">教学示意 · 前文“今天的天气很” · 不是实际天气或模型运行结果</text><rect x="60" y="220" width="740" height="700" rx="16" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="90" y="275" font-size="30" fill="#5146D9" font-weight="600">同一候选分布</text><text x="90" y="367" font-size="28" fill="#1D2433" font-weight="400">晴朗</text><rect x="220" y="335" width="385.00000000000006" height="50" rx="4" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="630.0" y="370" font-size="26" fill="#1D2433" font-weight="400">0.55</text><text x="90" y="472" font-size="28" fill="#1D2433" font-weight="400">寒冷</text><rect x="220" y="440" width="175.0" height="50" rx="4" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="420.0" y="475" font-size="26" fill="#1D2433" font-weight="400">0.25</text><text x="90" y="577" font-size="28" fill="#1D2433" font-weight="400">温暖</text><rect x="220" y="545" width="84.0" height="50" rx="4" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="329.0" y="580" font-size="26" fill="#1D2433" font-weight="400">0.12</text><text x="90" y="682" font-size="28" fill="#1D2433" font-weight="400">潮湿</text><rect x="220" y="650" width="35.0" height="50" rx="4" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="280.0" y="685" font-size="26" fill="#1D2433" font-weight="400">0.05</text><text x="90" y="787" font-size="28" fill="#1D2433" font-weight="400">安静</text><rect x="220" y="755" width="21.0" height="50" rx="4" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="266.0" y="790" font-size="26" fill="#1D2433" font-weight="400">0.03</text><text x="90" y="865" font-size="24" fill="#1D2433" font-weight="400">五项概率合计 1.00</text><rect x="920" y="220" width="620" height="180" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="944" y="302.0" font-size="26" fill="#1D2433" font-weight="600">top-k＝2</text><text x="944" y="336.0" font-size="26" fill="#1D2433" font-weight="400">保留前两项：晴朗、寒冷</text><text x="945" y="450" font-size="26" fill="#327F78" font-weight="600">按候选数量截取</text><rect x="920" y="560" width="620" height="180" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="944" y="642.0" font-size="26" fill="#1D2433" font-weight="600">top-p＝0.90</text><text x="944" y="676.0" font-size="26" fill="#1D2433" font-weight="400">保留前三项：晴朗、寒冷、温暖</text><text x="945" y="790" font-size="24" fill="#D15F43" font-weight="600">0.55＋0.25＋0.12＝0.92 ≥ 0.90</text><text x="945" y="840" font-size="24" fill="#1D2433" font-weight="400">按累计概率达到或超过阈值截取</text><path d="M800 365H860V310H920" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M800 680H860V650H920" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="1020" width="1480" height="180" rx="16" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="90" y="1076" font-size="30" fill="#5146D9" font-weight="600">两种方法独立对照，再在各自保留的集合内采样。</text><text x="90" y="1130" font-size="26" fill="#1D2433" font-weight="400">数字只描述候选分配；高概率不保证事实正确。</text><path d="M60 1270H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1309" font-size="20" fill="#565E69" font-weight="400">top-k 按候选数量保留；top-p 按累计概率保留达到阈值的最小集合。</text><text x="60" y="1339" font-size="20" fill="#565E69" font-weight="400">第六章的检索 top-k 则表示文档候选片段数量，两者对象不同。</text></svg>