<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 6-7　智能体的基本任务循环</title><desc>新生导览任务中，三项事实齐备则生成草稿，缺获取建议则在获准范围内补查备注，查遍材料仍缺证据则报告缺项停止。生成或检索后核对结果和停止条件，尚可继续才返回观察；三行是分支而非三个连续步骤。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect x="0" y="0" width="1600" height="1110" rx="0" fill="#F6F3EB" stroke="#F6F3EB" stroke-width="2"/><text x="64" y="51" font-size="21" fill="#5146D9" font-weight="600" text-anchor="start">AIOS101  /  X-lab  /  自学教材</text><text x="64" y="116" font-size="39" fill="#1D2433" font-weight="700" text-anchor="start">图 6-7　智能体的基本任务循环</text><text x="64" y="180" font-size="29" fill="#327F78" font-weight="400" text-anchor="start">新生导览的同一个目标，遇到不同反馈，下一步应当不同。</text><rect x="64" y="224" width="1472" height="104" rx="8" fill="#EEEBFA" stroke="#5146D9" stroke-width="2"/><text x="94" y="267" font-size="32" fill="#5146D9" font-weight="700" text-anchor="start">目标：依据固定 README 写三项导览</text><text x="94" y="307" font-size="26" fill="#1D2433" font-weight="400" text-anchor="start">任务从开始就受资料范围、授权、步数与预算约束</text><text x="114" y="386" font-size="28" fill="#626876" font-weight="600" text-anchor="start">观察到的反馈</text><text x="826" y="386" font-size="28" fill="#626876" font-weight="600" text-anchor="start">据此选择下一步</text><circle cx="96" cy="454" r="16" fill="#327F78"/><text x="96" y="462" font-size="22" fill="white" font-weight="600" text-anchor="middle">1</text><text x="132" y="462" font-size="32" fill="#327F78" font-weight="600" text-anchor="start">三项事实已找到</text><path d="M635 452H790" stroke="#327F78" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="827" y="462" font-size="33" fill="#327F78" font-weight="700" text-anchor="start">生成带来源的草稿</text><path d="M1425 456H1508V857H827" stroke="#327F78" stroke-width="2" fill="none" stroke-dasharray="9 7"/><circle cx="96" cy="605" r="16" fill="#5146D9"/><text x="96" y="613" font-size="22" fill="white" font-weight="600" text-anchor="middle">2</text><text x="132" y="613" font-size="32" fill="#5146D9" font-weight="600" text-anchor="start">有项目定位，缺获取建议</text><path d="M635 603H790" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="827" y="613" font-size="33" fill="#5146D9" font-weight="700" text-anchor="start">获准范围内补查“备注”</text><path d="M1425 607H1508V857H827" stroke="#5146D9" stroke-width="2" fill="none" stroke-dasharray="9 7"/><circle cx="96" cy="756" r="16" fill="#C65D43"/><text x="96" y="764" font-size="22" fill="white" font-weight="600" text-anchor="middle">3</text><text x="132" y="764" font-size="32" fill="#C65D43" font-weight="600" text-anchor="start">查遍限定材料仍缺证据</text><path d="M635 754H790" stroke="#C65D43" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="827" y="764" font-size="33" fill="#C65D43" font-weight="700" text-anchor="start">报告缺项并停止</text><text x="827" y="903" font-size="28" fill="#5146D9" font-weight="600" text-anchor="start">核对新结果、更新状态与停止条件</text><path d="M795 872H55V391H88" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="95" y="852" font-size="26" fill="#5146D9" font-weight="400" text-anchor="start">尚可继续时，重新观察与选择</text><text x="95" y="941" font-size="27" fill="#1D2433" font-weight="400" text-anchor="start">完成、证据不足、权限不符或预算用尽，都可能成为停止原因。</text><path d="M64 981H1536" stroke="#CBC7BF" stroke-width="2" fill="none"/><text x="64" y="1027" font-size="24" fill="#626876" font-weight="400" text-anchor="start">三种反馈是条件分支，不是要求依次走完的三个固定步骤；整图为教学设计，未实际运行。</text><text x="64" y="1062" font-size="24" fill="#626876" font-weight="400" text-anchor="start">图中行动只在获准范围内执行；下一步依据返回结果改变，不代表循环可以无限继续。</text></svg>