<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1670" viewBox="0 0 1600 1670" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 5-7 单个请求的延迟与整个服务的吞吐</title><desc>单请求沿网络与排队、预填充、首 token 出现、继续解码到完整回答结束；首 token 延迟和完整响应时间用不同括号标出。同时段其他请求共同构成整个服务的吞吐统计。时间不按比例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1670" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从训练到推理</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 5-7  单个请求的延迟与整个服务的吞吐</text><text x="60" y="170" font-size="24" fill="#D15F43" font-weight="400">时间示意，不按比例；没有填入未经测量的速度。</text><rect x="500" y="220" width="1040" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="524" y="284.0" font-size="26" fill="#1D2433" font-weight="600">发出新生导言请求</text><path d="M1020 330V365" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="500" y="365" width="1040" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="524" y="429.0" font-size="26" fill="#1D2433" font-weight="600">网络、服务接收与可能排队</text><path d="M1020 475V510" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="500" y="510" width="1040" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="524" y="574.0" font-size="26" fill="#1D2433" font-weight="600">预填充：处理已有上下文</text><path d="M1020 620V655" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="500" y="655" width="1040" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="524" y="719.0" font-size="26" fill="#1D2433" font-weight="600">首个 token 出现</text><path d="M1020 765V800" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="500" y="800" width="1040" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="524" y="864.0" font-size="26" fill="#1D2433" font-weight="600">继续解码并逐步呈现</text><path d="M1020 910V945" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="500" y="945" width="1040" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="524" y="1009.0" font-size="26" fill="#1D2433" font-weight="600">完整回答结束</text><path d="M455 275H340V710H455" stroke="#5146D9" stroke-width="3" fill="none" stroke-dasharray="8 6"/><text x="60" y="470" font-size="27" fill="#5146D9" font-weight="600">首 token 延迟</text><path d="M455 275H285V1000H455" stroke="#327F78" stroke-width="3" fill="none" stroke-dasharray="8 6"/><text x="60" y="865" font-size="27" fill="#327F78" font-weight="600">完整响应时间</text><rect x="60" y="1180" width="1480" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="1244.0" font-size="26" fill="#1D2433" font-weight="600">同一时段还有多位学生的请求</text><path d="M800 1290V1380" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="1380" width="1480" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="84" y="1444.0" font-size="26" fill="#1D2433" font-weight="600">吞吐：整个服务单位时间完成多少 token 或请求</text><path d="M60 1540H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1579" font-size="20" fill="#565E69" font-weight="400">首 token 出现并不等于整段回答完成；流式呈现不会自动消除后续解码。</text><text x="60" y="1609" font-size="20" fill="#565E69" font-weight="400">吞吐必须说明 token 或请求等统计口径；提高吞吐不保证每位用户等待更短。</text></svg>