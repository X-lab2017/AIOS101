<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1450" viewBox="0 0 1600 1450" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 4-4 分词、下一 token 候选分布与训练目标</title><desc>两个独立教学示例：我爱开源 AI 被假想切成四个 token；前文开源社区鼓励共同的候选概率分别为创造 0.55、协作 0.30、讨论 0.10、其他 0.05。实际后续 token 与候选分布比较形成损失。数字不是实测或事实正确率。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1450" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从数据到模型</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 4-4  分词、下一 token 候选分布与训练目标</text><text x="60" y="170" font-size="25" fill="#D15F43" font-weight="600">教学示意 · 假想分词与简化概率，不来自真实模型</text><rect x="60" y="210" width="1480" height="200" rx="16" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="85" y="253" font-size="25" fill="#5146D9" font-weight="600">A  文本怎样变成 token</text><text x="90" y="325" font-size="35" fill="#1D2433" font-weight="600">我爱开源 AI</text><path d="M420 315H650" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="700" y="280" width="170" height="70" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="724" y="324.0" font-size="26" fill="#1D2433" font-weight="600">我</text><rect x="900" y="280" width="170" height="70" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="924" y="324.0" font-size="26" fill="#1D2433" font-weight="600">爱</text><rect x="1100" y="280" width="170" height="70" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="1124" y="324.0" font-size="26" fill="#1D2433" font-weight="600">开源</text><rect x="1300" y="280" width="170" height="70" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="1324" y="324.0" font-size="26" fill="#1D2433" font-weight="600">AI</text><text x="700" y="387" font-size="21" fill="#1D2433" font-weight="400">一种假想切分；不对应特定真实分词器。</text><text x="60" y="490" font-size="27" fill="#5146D9" font-weight="600">B  下一 token 的候选与训练目标</text><rect x="60" y="530" width="660" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="594.0" font-size="26" fill="#1D2433" font-weight="600">前文：开源社区鼓励共同</text><rect x="920" y="530" width="620" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="944" y="594.0" font-size="26" fill="#1D2433" font-weight="600">模型根据当前参数计算</text><path d="M720 585H920" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1230 640V720" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="720" width="1480" height="400" rx="16" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="90" y="766" font-size="28" fill="#5146D9" font-weight="600">下一 token 候选分布（简化）</text><text x="90" y="828" font-size="26" fill="#1D2433" font-weight="400">创造</text><rect x="290" y="800" width="577.5" height="40" rx="3" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="917.5" y="829" font-size="26" fill="#1D2433" font-weight="400">0.55</text><text x="90" y="903" font-size="26" fill="#1D2433" font-weight="400">协作</text><rect x="290" y="875" width="315.0" height="40" rx="3" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="655.0" y="904" font-size="26" fill="#1D2433" font-weight="400">0.30</text><text x="90" y="978" font-size="26" fill="#1D2433" font-weight="400">讨论</text><rect x="290" y="950" width="105.0" height="40" rx="3" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="445.0" y="979" font-size="26" fill="#1D2433" font-weight="400">0.10</text><text x="90" y="1053" font-size="26" fill="#1D2433" font-weight="400">其他合计</text><rect x="290" y="1025" width="52.5" height="40" rx="3" fill="#5146D9" stroke="#5146D9" stroke-width="2"/><text x="392.5" y="1054" font-size="26" fill="#1D2433" font-weight="400">0.05</text><rect x="60" y="1200" width="650" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="1264.0" font-size="26" fill="#1D2433" font-weight="600">训练文本中的实际后续 token</text><rect x="920" y="1200" width="620" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="944" y="1247.0" font-size="26" fill="#1D2433" font-weight="600">与候选分布比较</text><text x="944" y="1281.0" font-size="26" fill="#1D2433" font-weight="400">并形成损失</text><path d="M710 1255H920" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1230 1120V1200" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M60 1320H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1359" font-size="20" fill="#565E69" font-weight="400">候选概率之和为 1；0.55 表示候选分配，不表示 55% 的事实正确率。</text><text x="60" y="1389" font-size="20" fill="#565E69" font-weight="400">A 与 B 是两个独立教学示例；训练目标取自训练文本的实际后续 token，而非人工选最高概率项。</text></svg>