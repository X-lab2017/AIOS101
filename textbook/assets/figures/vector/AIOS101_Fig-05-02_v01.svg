<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1230" viewBox="0 0 1600 1230" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 5-2 语言模型推理的最小生成循环</title><desc>提示与上下文经过分词和预填充，模型计算下一 token 候选分布，生成策略选择一个 token，将其加入输出与后续上下文；未达到结束条件则继续，达到则完成返回。普通推理不更新参数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1230" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从训练到推理</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 5-2  语言模型推理的最小生成循环</text><rect x="60" y="190" width="1480" height="205" rx="16" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="85" y="227" font-size="22" fill="#5146D9" font-weight="600">一次输入处理</text><rect x="90" y="255" width="410" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="114" y="302.0" font-size="26" fill="#1D2433" font-weight="600">提示、历史对话</text><text x="114" y="336.0" font-size="26" fill="#1D2433" font-weight="400">与系统指令</text><rect x="590" y="255" width="410" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="614" y="319.0" font-size="26" fill="#1D2433" font-weight="600">分词并组成上下文</text><rect x="1090" y="255" width="410" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="1114" y="302.0" font-size="26" fill="#1D2433" font-weight="600">预填充：</text><text x="1114" y="336.0" font-size="26" fill="#1D2433" font-weight="400">处理已有输入</text><path d="M500 310H590" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1000 310H1090" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="480" width="1480" height="415" rx="16" fill="#F0F3EE" stroke="#327F78" stroke-width="2"/><text x="85" y="517" font-size="22" fill="#327F78" font-weight="600">逐 token 解码</text><rect x="90" y="555" width="410" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="114" y="602.0" font-size="26" fill="#1D2433" font-weight="600">模型计算下一个 token</text><text x="114" y="636.0" font-size="26" fill="#1D2433" font-weight="400">的候选分布</text><rect x="590" y="555" width="410" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="614" y="602.0" font-size="26" fill="#1D2433" font-weight="600">按生成策略</text><text x="614" y="636.0" font-size="26" fill="#1D2433" font-weight="400">选择一个 token</text><rect x="1090" y="555" width="410" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="1114" y="602.0" font-size="26" fill="#1D2433" font-weight="600">加入输出</text><text x="1114" y="636.0" font-size="26" fill="#1D2433" font-weight="400">与后续上下文</text><path d="M1295 365V455H295V555" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M500 610H590" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1000 610H1090" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1295 665V745" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="1090" y="745" width="410" height="110" rx="20" fill="#FFF0E7" stroke="#D15F43" stroke-width="2"/><text x="1114" y="809.0" font-size="26" fill="#1D2433" font-weight="600">达到结束条件？</text><path d="M1090 800H295V665" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="530" y="780" font-size="21" fill="#327F78" font-weight="400">否：继续计算下一个 token</text><path d="M1295 855V965" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="1320" y="917" font-size="21" fill="#327F78" font-weight="400">是</text><rect x="1090" y="965" width="410" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="1114" y="1029.0" font-size="26" fill="#1D2433" font-weight="600">返回并呈现输出</text><text x="80" y="990" font-size="34" fill="#5146D9" font-weight="700">使用参数</text><text x="80" y="1045" font-size="26" fill="#1D2433" font-weight="400">普通生成请求不会因每个 token 自动训练。</text><path d="M60 1100H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1139" font-size="20" fill="#565E69" font-weight="400">机制示意；实际服务可边生成边流式返回，图中终点表示完成输出。</text><text x="60" y="1169" font-size="20" fill="#565E69" font-weight="400">输入上下文、候选选择与停止条件共同影响结果；不以生成箭头表示参数更新。</text></svg>