<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500" font-family="Noto Sans CJK SC, sans-serif" role="img"><title>图 5-6 模型推理的系统分层</title><desc>任务经过客户端与网络、服务与队列、推理引擎，结合模型及配置和硬件软件环境形成结果，再经服务返回客户端。图为概念分层，不是对某个产品内部架构的测量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5146D9"/></marker></defs><rect width="1600" height="1500" fill="#F6F3EB"/><text x="60" y="49" font-size="18" fill="#5146D9" font-weight="600">AIOS101   /   X-lab   /   从训练到推理</text><text x="60" y="112" font-size="40" fill="#1D2433" font-weight="700">图 5-6  模型推理的系统分层</text><text x="60" y="168" font-size="25" fill="#327F78" font-weight="400">沿系统层次定位现象；每一层回答不同的问题。</text><rect x="300" y="210" width="1000" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="324" y="274.0" font-size="26" fill="#1D2433" font-weight="600">使用者与具体任务</text><rect x="300" y="390" width="1000" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="324" y="454.0" font-size="26" fill="#1D2433" font-weight="600">客户端、网络与产品界面</text><rect x="300" y="570" width="1000" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="324" y="634.0" font-size="26" fill="#1D2433" font-weight="600">服务、接口、鉴权、队列与路由</text><rect x="300" y="750" width="1000" height="110" rx="20" fill="#EEEAFB" stroke="#5146D9" stroke-width="2"/><text x="324" y="814.0" font-size="26" fill="#1D2433" font-weight="600">推理引擎：计算执行、状态与请求管理</text><path d="M800 320V390" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M800 500V570" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M800 680V750" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="60" y="985" width="700" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="84" y="1032.0" font-size="26" fill="#1D2433" font-weight="600">模型结构、参数、分词器</text><text x="84" y="1066.0" font-size="26" fill="#1D2433" font-weight="400">与生成配置</text><rect x="840" y="985" width="700" height="110" rx="20" fill="white" stroke="#D7D3C9" stroke-width="2"/><text x="864" y="1032.0" font-size="26" fill="#1D2433" font-weight="600">处理器、内存、存储、互连</text><text x="864" y="1066.0" font-size="26" fill="#1D2433" font-weight="400">与软件环境</text><path d="M650 860V925H410V985" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M950 860V925H1190V985" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="550" y="1210" width="500" height="110" rx="20" fill="#E1EFEB" stroke="#327F78" stroke-width="2"/><text x="574" y="1274.0" font-size="26" fill="#1D2433" font-weight="600">生成结果</text><path d="M410 1095V1265H550" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M1190 1095V1265H1050" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M800 1320V1345H30V625H300" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="65" y="880" font-size="21" fill="#327F78" font-weight="400">结果返回服务</text><path d="M1300 625H1430V445H1300" stroke="#5146D9" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="1300" y="700" font-size="21" fill="#327F78" font-weight="400">返回客户端</text><path d="M60 1370H1540" stroke="#CCC8BE" stroke-width="3" fill="none" /><text x="60" y="1409" font-size="20" fill="#565E69" font-weight="400">概念分层，不表示任何在线产品的实际内部架构，也不能凭此推断其模型版本。</text><text x="60" y="1439" font-size="20" fill="#565E69" font-weight="400">运行表现由多层共同形成；硬件速度、引擎效率与回答真实性应分别判断。</text></svg>