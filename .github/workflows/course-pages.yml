name: Course website
on:
  push:
    branches: [main]
    paths: ['site/**', 'brand/**', 'textbook/**', 'activities/student/**', 'specs/**', 'CONSTITUTION.md', 'scripts/**', '.github/workflows/course-pages.yml']
  pull_request:
    paths: ['site/**', 'brand/**', 'textbook/**', 'activities/student/**', 'specs/**', 'CONSTITUTION.md', 'scripts/**', '.github/workflows/course-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: course-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/package_course_brand.py --check
      - run: python scripts/build_site.py
      - run: node --check site/app.js
      - run: node --check site/brand.js
      - run: python scripts/check_repo.py
      - run: python scripts/check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
